/* ═══════════════ УСПІШНІСТЬ (вчасно / із запізненням) ═══════════════ */
function punctualityPanel(orders) {
  // Збираємо не лише цифри, а й самі записи — щоб можна було подивитись, що саме
  const lateOrders = [], onTimeOrders = [], noDataOrders = [];
  orders.forEach(o => {
    const num = gv(o,"Номер замовлення");
    const term = parseDeadline(gv(o,"Термін"));
    const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
    const issuedDates = its.map(it => parseDeadline(gv(it,"Дата видачі"))).filter(Boolean);
    if (!term || !its.length || issuedDates.length !== its.length) { noDataOrders.push(o); return; }
    const lastIssued = new Date(Math.max.apply(null, issuedDates));
    const days = Math.round((lastIssued - term) / 86400000);
    if (lastIssued <= term) onTimeOrders.push(o);
    else lateOrders.push({ order: o, days: days });
  });

  // Задачі з дедлайном
  const lateTasks = [], onTimeTasks = [];
  const now = new Date(); now.setHours(0,0,0,0);
  TASKS.forEach(t => {
    const dl = parseDeadline(t["Дедлайн"]);
    if (!dl) return;
    if (t["Статус"] === "так") {
      const doneD = parseDeadline(t["Виконано"]);
      if (doneD && doneD > dl) lateTasks.push({ task: t, days: Math.round((doneD - dl)/86400000) });
      else onTimeTasks.push(t);
    } else if (dl < now) {
      lateTasks.push({ task: t, days: Math.round((now - dl)/86400000), open: true });
    }
  });

  const measured = onTimeOrders.length + lateOrders.length;
  const pct = measured ? Math.round(onTimeOrders.length / measured * 100) : null;
  const tTotal = onTimeTasks.length + lateTasks.length;
  const tPct = tTotal ? Math.round(onTimeTasks.length / tTotal * 100) : null;

  // Зберігаємо для перегляду деталей
  window._punct = { lateOrders, onTimeOrders, noDataOrders, lateTasks, onTimeTasks };

  const color = v => v === null ? "" : (v >= 85 ? "#2FA98C" : v >= 60 ? "#EF9F27" : "var(--st-postponed-fg)");

  function metric(label, value, sub, accent, kind, clickable) {
    return "<div class='pay-split-item" + (clickable ? " clickable" : "") + "'" +
      (clickable ? " onclick=\"openPunctList('" + kind + "')\"" : "") + ">" +
      "<div class='ps-label'>" + label + "</div>" +
      "<div class='ps-value'" + (accent ? " style='color:" + accent + "'" : "") + ">" + value + "</div>" +
      (sub ? "<div class='ps-sub'>" + sub + "</div>" : "") + "</div>";
  }

  return "<div class='stat-panel'><div class='stat-panel-label'>Успішність — чи вкладаємось у терміни</div>" +
    "<div class='pay-split'>" +
      metric("Замовлення вчасно", pct === null ? "—" : pct + "%",
             onTimeOrders.length + " з " + measured + " виданих", color(pct), "onTimeOrders", onTimeOrders.length > 0) +
      metric("Із запізненням", lateOrders.length,
             lateOrders.length ? "переглянути →" : "немає", lateOrders.length ? "var(--st-postponed-fg)" : "", "lateOrders", lateOrders.length > 0) +
      metric("Задачі вчасно", tPct === null ? "—" : tPct + "%",
             tTotal ? onTimeTasks.length + " з " + tTotal : "немає дедлайнів", color(tPct), "onTimeTasks", onTimeTasks.length > 0) +
      metric("Прострочені задачі", lateTasks.length,
             lateTasks.length ? "переглянути →" : "немає", lateTasks.length ? "var(--st-postponed-fg)" : "", "lateTasks", lateTasks.length > 0) +
    "</div>" +
    (noDataOrders.length ? "<div class='d-bonus-hint'>Ще " + noDataOrders.length + " замовлень без оцінки — немає терміну або виріб ще не видано.</div>" : "") +
    "</div>";
}

function sameDay(a, b) {
  return a && b && a.getDate() === b.getDate() && a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();

/* Локальна дата у форматі YYYY-MM-DD (без переводу в UTC — інакше день зсувається) */
function localISO(d) {
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

/* ═══════════════ ЗАВАНТАЖЕННЯ ДНІВ (планування термінів) ═══════════════
   Скільки активних робіт (не виданих) стоїть на конкретну дату — ремонт + пошив. */
function dayLoad(d) {
  let n = 0;
  ORDERS.forEach(o => {
    if (getStatus(gv(o,"Номер замовлення")) === "issued") return;
    const dl = parseDeadline(gv(o,"Термін"));
    if (dl && sameDay(dl, d)) n++;
  });
  TAILOR.forEach(t => {
    if (gv(t,"Статус") === "📦 Виданий") return;
    const dl = parseDeadline(gv(t,"Термін"));
    if (dl && sameDay(dl, d)) n++;
  });
  return n;
}
function loadLevel(load) {
  if (!DAILY_CAP) return "";
  if (load >= DAILY_CAP) return "full";
  if (load >= Math.ceil(DAILY_CAP * 0.6)) return "busy";
  return "free";
}
/* Найближча дата (з сьогодні), де завантаження нижче норми */
function recommendedDeadline() {
  if (!DAILY_CAP) return null;
  const base = new Date(); base.setHours(0,0,0,0);
  for (let i = 0; i < 180; i++) {
    const cur = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    if (dayLoad(cur) < DAILY_CAP) return cur;
  }
  return null;
}
function ddmmToISO(s) { const d = parseDeadline(s); return d ? localISO(d) : ""; }

    html += "<div class='deadline-load " + lvl + "'>На " + formatDeadlineDate(pickedISO) + ": " + load + " з " + DAILY_CAP + " — " + label + "</div>";
  }

/* Спільна логіка позначок дня календаря: субота/неділя/свято/проміжок сьогодні→термін.
   Використовується і формою створення (rwcal), і карткою замовлення. */
function calDayExtraClasses(iso, todayISO, selISO) {
  var dow = new Date(iso + "T00:00:00").getDay();
  var cls = "";
  if (dow === 6) cls += " sat";
  if (dow === 0) cls += " sun";
  if (isHoliday(iso)) cls += " holiday";
  if (selISO && todayISO && iso !== todayISO && iso !== selISO) {
    var lo = todayISO < selISO ? todayISO : selISO;
    var hi = todayISO < selISO ? selISO : todayISO;
    if (iso > lo && iso < hi) cls += " range";
  }
  return cls;
}
var calY, calM;
function calInit(){ var pd = parseDeadline(NO.deadline); var base = pd || new Date(); calY = base.getFullYear(); calM = base.getMonth(); }
function datePopShift(delta){ calM += delta; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } var pop = document.getElementById("rwcal-pop"); if (pop) pop.innerHTML = renderDatePopHTML(); }
function renderDatePopHTML(){

  var startDow = (new Date(calY, calM, 1).getDay() + 6) % 7;
  var daysIn = new Date(calY, calM + 1, 0).getDate();
  var prevDays = new Date(calY, calM, 0).getDate();
  var todayISO = localISO(new Date());
  var pdd = parseDeadline(NO.deadline); var selISO = pdd ? localISO(pdd) : "";
  var h = "<div class='rwcal-head'><div class='rwcal-title'>" + MN[calM] + " " + calY + "</div><div class='rwcal-nav'><button type='button' onclick='event.stopPropagation();datePopShift(-1)'>‹</button><button type='button' onclick='event.stopPropagation();datePopShift(1)'>›</button></div></div>";

  ["ПН","ВТ","СР","ЧТ","ПТ","СБ","НД"].forEach(function(d){ h += "<div class='rwcal-dow'>" + d + "</div>"; });
  for (var i = startDow; i > 0; i--) { h += "<div class='rwcal-day mut'>" + (prevDays - i + 1) + "</div>"; }
  for (var d = 1; d <= daysIn; d++) {
    var iso = calY + "-" + String(calM + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    var c = "rwcal-day" + (iso === todayISO ? " today" : "") + (iso === selISO ? " sel" : "") + calDayExtraClasses(iso, todayISO, selISO);

var ocalY, ocalM, ocalTerm;
function ocalInit(term) { const pd = parseDeadline(term); const base = pd || new Date(); ocalY = base.getFullYear(); ocalM = base.getMonth(); ocalTerm = term; }
function ocalShift(delta) { ocalM += delta; if (ocalM < 0) { ocalM = 11; ocalY--; } if (ocalM > 11) { ocalM = 0; ocalY++; } const box = document.getElementById("ocal-body"); if (box) box.innerHTML = renderOcalHTML(); }
function renderOcalHTML() {
  const MN = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const startDow = (new Date(ocalY, ocalM, 1).getDay() + 6) % 7;
  const daysIn = new Date(ocalY, ocalM + 1, 0).getDate();
  const prevDays = new Date(ocalY, ocalM, 0).getDate();
  const todayISO = localISO(new Date());
  const pdd = parseDeadline(ocalTerm); const selISO = pdd ? localISO(pdd) : "";
  let h = "<div class='rwcal-head'><div class='rwcal-title'>" + MN[ocalM] + " " + ocalY + "</div><div style='display:flex;align-items:center;gap:6px'>" +
    "<span class='rwcal-info-btn' onclick=\"event.stopPropagation();var l=document.getElementById('ocal-legend');l.style.display=l.style.display==='none'?'flex':'none';\">i</span>" +
    "<div class='rwcal-nav'><button type='button' onclick='event.stopPropagation();ocalShift(-1)'>‹</button><button type='button' onclick='event.stopPropagation();ocalShift(1)'>›</button></div></div></div>";
  h += "<div class='rwcal-grid'>";
  ["ПН","ВТ","СР","ЧТ","ПТ","СБ","НД"].forEach(d => h += "<div class='rwcal-dow'>" + d + "</div>");
  for (let i = startDow; i > 0; i--) h += "<div class='rwcal-day mut'>" + (prevDays - i + 1) + "</div>";
  for (let d = 1; d <= daysIn; d++) {
    const iso = ocalY + "-" + String(ocalM + 1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const c = "rwcal-day" + (iso === todayISO ? " today" : "") + (iso === selISO ? " sel" : "") + calDayExtraClasses(iso, todayISO, selISO);
    const hol = isHoliday(iso);
    h += "<div class='" + c + "'" + (hol ? " title='" + hol + "'" : "") + ">" + d + "</div>";
  }
  const tail = (7 - ((startDow + daysIn) % 7)) % 7;
  for (let t = 1; t <= tail; t++) h += "<div class='rwcal-day mut'>" + t + "</div>";
  h += "</div>";
  h += "<div class='rwcal-legend' id='ocal-legend' style='display:none'>" +
    "<span><i style='box-shadow:inset 0 0 0 1px var(--cognac);background:transparent'></i>сьогодні</span>" +
    "<span><i style='background:var(--cognac)'></i>термін</span>" +
    "<span><i style='background:rgba(160,132,92,0.14)'></i>днів на роботу</span>" +
    "<span><i style='box-shadow:inset 0 -2px 0 rgba(153,60,29,0.65)'></i>свято</span>" +
    "<span><i style='background:rgba(58,50,40,0.05)'></i>субота</span>" +
    "<span><i style='background:rgba(58,50,40,0.1)'></i>неділя</span>" +
    "</div>";
  return h;
}
function toggleOrderCalPop(term) {

let BONUS_PCT = 3;            // базовий відсоток (запасний варіант)
/* Відсоток нарахування за статусом клієнта. null → береться базовий */
let BONUS_PCT_RATING = { green: null, yellow: null, red: null };

function bonusPctFor(phone) {
  const r = clientRating(phone);
  const v = BONUS_PCT_RATING[r.key];
  return (v === null || v === undefined || isNaN(v)) ? BONUS_PCT : v;
}
let BONUS_MIN_SPEND = 200;    // мінімальний баланс для списання балів
let BONUS_SPEND_CAP = 30;     // максимум списання, % від суми чека

/* Баланс балів клієнта = сума нарахованих - сума списаних по всіх замовленнях телефону */
function clientBonusBalance(phone) {
  let accrued = 0, spent = 0;
  ORDERS.filter(o => gv(o,"Телефон") === phone).forEach(o => {
    accrued += extractAmt(gv(o,"Нараховано бонусів"));
    spent += extractAmt(gv(o,"Списано бонусів"));
  });
  return accrued - spent;
}

  ["📦 Виданий", "Видано", "#639922"]
];
function itemStatusIndex(status) {
  if (status === "📦 Виданий") return 3;
  if (status === "✅ Готово") return 2;
  if (status === "⚙️ В роботі") return 1;
  return 0;
}

/* Звальний відмінок (кличний) — мʼяке відмінювання */
function vocative(name) {
  if (!name) return "";
  const parts = name.trim().split(/\s+/);
  const first = parts[0];
  const lc = first.toLowerCase();
  // жіночі на -а/-я
  if (/[бвгґджзклмнпрстфхцчшщ]а$/i.test(first)) return first.slice(0,-1) + "о";
  if (/ія$/i.test(first)) return first.slice(0,-1) + "є";
  if (/[зждлр]я$/i.test(first)) return first.slice(0,-1) + "е";
  // чоловічі на приголосний
  if (/[бвгґджзклмнпрстфхцчшщ]$/i.test(first)) {
    if (/[гґкх]$/i.test(first)) return first + "у";
    return first + "е";
  }
  if (/й$/i.test(first)) return first.slice(0,-1) + "ю";
  if (/о$/i.test(first)) return first;
  return first;
}

/* Статичний міні-календар поточного місяця з позначеним терміном (клік поки не працює — доопрацюємо окремо) */
function buildMiniCal(termStr) {
  const now = new Date();
  const monthNames = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  let selDay = null;
  const m = (termStr || "").match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m && parseInt(m[2]) === now.getMonth()+1 && parseInt(m[3]) === now.getFullYear()) selDay = parseInt(m[1]);

  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOffset = (first.getDay() + 6) % 7; // понеділок=0
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const daysInPrev = new Date(now.getFullYear(), now.getMonth(), 0).getDate();

  let cells = "";
  for (let i = startOffset; i > 0; i--) cells += "<div class='mini-cal-day mut'>" + (daysInPrev - i + 1) + "</div>";
  for (let d = 1; d <= daysInMonth; d++) cells += "<div class='mini-cal-day" + (d === selDay ? " sel" : "") + "'>" + d + "</div>";

  const dow = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].map(d => "<div class='mini-cal-dow'>" + d + "</div>").join("");
  const label = termStr ? termStr : (selDay ? "" : "без терміну");
  return "<div class='mini-cal'><div class='mini-cal-head'><span>" + monthNames[now.getMonth()] + " " + now.getFullYear() + "</span><span style='color:var(--txt-3);font-size:10px'>" + label + "</span></div>" +
    "<div class='mini-cal-grid'>" + dow + cells + "</div></div>";
}

  const phone = gv(o,"Телефон");
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const total = its.reduce((s,it) => s + extractAmt(gv(it,"Сума")), 0);
  const allIssuedNow = its.length > 0 && its.every(it => gv(it,"Статус") === "📦 Виданий");
  const rating = clientRating(phone);

  const accrued = extractAmt(gv(o,"Нараховано бонусів"));
  const spent = extractAmt(gv(o,"Списано бонусів"));
  const balance = clientBonusBalance(phone);
  const clientPct = bonusPctFor(phone);
  const wouldAccrue = Math.round(total * clientPct / 100);

  let bonusInner =
    "<div class='d-pay-row'><span class='pl'>Баланс клієнта</span><span class='pv' style='color:var(--cognac)'>" + balance.toLocaleString("uk-UA") + " балів</span></div>";

  if (allIssuedNow && !accrued) {
    if (clientPct > 0) {
      bonusInner += "<button class='d-settle-btn' style='background:#2FA98C' onclick=\"openAccrueBonus('" + num + "'," + wouldAccrue + ")\">Нарахувати " + wouldAccrue + " балів (" + clientPct + "%)</button>";
      bonusInner += "<div class='d-bonus-hint'>Ставка " + clientPct + "% — за статусом «" + rating.label + "». Не обов'язково: якщо була знижка, можна не нараховувати.</div>";
    } else {
      bonusInner += "<div class='d-bonus-hint'>Для статусу «" + rating.label + "» бонуси не нараховуються (0%).</div>";
    }
  } else if (!accrued) {
    bonusInner += "<div class='d-bonus-hint'>" + (clientPct > 0
      ? ("Нарахування " + wouldAccrue + " балів (" + clientPct + "% за статусом «" + rating.label + "») — доступне після видачі")
      : ("Для статусу «" + rating.label + "» бонуси не нараховуються")) + "</div>";

    } else if (balance > 0) {

/* Позначити готовими всі ще не готові послуги/вироби замовлення одразу —
   зручно, коли роботу вносять заднім числом і не хочуть клікати по кожній послузі. */
async function markOrderReady(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  for (let idx = 0; idx < its.length; idx++) {
    const it = its[idx];
    if (gv(it,"Статус") === "📦 Виданий") continue;
    const itemNum = gv(it,"Номер виробу") || (num + "-" + (idx+1));
    const svcs = servicesOfItem(itemNum);
    if (svcs.length) {
      for (const sv of svcs) {
        if (serviceStatusIndex(gv(sv,"Статус")) < 2) {
          await confirmServiceStatus(gv(sv,"Номер послуги"), "✅ Готово", gv(sv,"Майстер") || "");
        }
      }
    } else if (itemStatusIndex(gv(it,"Статус")) < 2) {
      await setItemStatus(num, idx, 2);
    }
  }
  if (detailOrderNum) openOrder(detailOrderNum);
}

function issueWholeOrder(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const pending = its.filter(it => gv(it,"Статус") !== "📦 Виданий");
  if (!pending.length) return;
  const names = masterNamesForRole();
  if (!isAdmin() && names.length === 1) { confirmIssueWholeOrder(num, names[0]); return; }
  const bg = document.getElementById("odm-bg");
  if (!bg.classList.contains("open")) { bg.classList.add("open"); settleOwnsModal = true; }
  const body = document.getElementById("odm-body");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  const opts = names.length
    ? names.map(m => "<button class='rating-opt' onclick=\"confirmIssueWholeOrder('" + num + "','" + m.replace(/'/g,"\\'") + "')\">" + m + "</button>").join("")
    : (masterNames().length ? "<div class='d-bonus-hint'>Для вашого акаунта немає доступного майстра</div>" : "<div class='d-bonus-hint'>Додайте майстрів у лист «Майстри»</div>");
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Хто видає замовлення?</div>" +
      "<div class='rating-opts'>" + opts + "</div>" +
      "<button onclick='closeSettle()' style='width:100%;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Скасувати</button>" +
    "</div>";
  body.appendChild(wrap);
}
async function confirmIssueWholeOrder(num, master) {
  closeSettle();
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const nowVal = new Date().toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric"}) + " " + new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  for (let idx = 0; idx < its.length; idx++) {
    const it = its[idx];
    if (gv(it,"Статус") === "📦 Виданий") continue;
    const wasNotified = !!gv(it,"Сповіщено");
    it["Статус"] = "📦 Виданий";
    it["Хто видав"] = master;
    it["Дата видачі"] = nowVal;
    if (!wasNotified) it["Сповіщено"] = nowVal;
    openOrder(num);
    const itemNum = gv(it,"Номер виробу") || (num + "-" + (idx+1));
    try {
      await fetch(API_URL.replace("/order","/status"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ item_num: itemNum, status: "📦 Виданий", master: master })
      });
      if (!wasNotified) {
        await fetch(API_URL.replace("/order","/notify"), {
          method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ item_num: itemNum, notified: true })
        });
      }
    } catch(e) { console.error("bulk issue failed", e); }
  }
  if (currentPage === "todayplan") renderers.todayplan();
  if (currentPage === "assign") renderers.assign();
  if (currentPage === "myworks") renderers.myworks();
}

/* Рейтинг клієнта за розрахунками: чи забирає виріб оплаченим */
const RATING_META = {
  green:  { dot: "🟢", label: "Розраховується" },
  yellow: { dot: "🟡", label: "Звичайний" },
  red:    { dot: "🔴", label: "Є борг" }
};

/* Підсумок по грошах клієнта: скільки винен за вже видані роботи */
function clientPaymentStats(phone) {
  let issuedDebt = 0, settledOrders = 0, openDebt = 0;

  ORDERS.filter(o => gv(o,"Телефон") === phone && !isOrderDeleted(o)).forEach(o => {
    const num = gv(o,"Номер замовлення");
    const total = orderTotal(num);
    if (!total) return;
    const payStr = gv(o,"Оплата");
    const prepay = isPrepayStr(payStr) ? extractAmt(payStr) : 0;
    const settle = extractAmt(gv(o,"Сума доплати"));
    const debt = Math.max(0, total - prepay - settle);
    const st = getStatus(num);
    if (st === "issued" || st === "partial") {
      if (debt > 0) issuedDebt += debt; else settledOrders++;
    } else if (debt > 0) openDebt += debt;
  });

  TAILOR.filter(t => gv(t,"Телефон") === phone && gv(t,"Примітка").indexOf("[ВИДАЛЕНО] ") !== 0).forEach(t => {
    const total = extractAmt(gv(t,"Вартість"));
    if (!total) return;
    const payStr = gv(t,"Оплата");
    const prepay = isPrepayStr(payStr) ? extractAmt(payStr) : 0;
    const settle = extractAmt(gv(t,"Сума доплати"));
    const debt = Math.max(0, total - prepay - settle);
    if (gv(t,"Статус") === "📦 Виданий") {
      if (debt > 0) issuedDebt += debt; else settledOrders++;
    } else if (debt > 0) openDebt += debt;
  });

  return { issuedDebt, settledOrders, openDebt };
}

/* Ручне перевизначення рейтингу (остання непорожня позначка по телефону) */
function manualRating(phone) {
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone);
  for (let i = orders.length - 1; i >= 0; i--) {
    const v = gv(orders[i], "Рейтинг вручну");
    if (v) return v;
  }
  return "";
}

function clientRating(phone) {
  const manual = manualRating(phone);
  if (manual && RATING_META[manual]) {
    return Object.assign({}, RATING_META[manual], { manual: true, key: manual });
  }
  const s = clientPaymentStats(phone);
  // Робота видана, а гроші не отримані — головний сигнал
  if (s.issuedDebt > 0) {
    return Object.assign({}, RATING_META.red, { key: "red", debt: s.issuedDebt });
  }
  // Є закриті замовлення і всі розраховані
  if (s.settledOrders > 0) {
    return Object.assign({}, RATING_META.green, { key: "green" });
  }
  return Object.assign({}, RATING_META.yellow, { key: "yellow" });
}

    : (masterNames().length ? "<div class='d-bonus-hint'>Для вашого акаунта немає доступного майстра</div>" : "<div class='d-bonus-hint'>Додайте майстрів у лист «Майстри»</div>");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>" + title + "</div>" +
      "<div class='rating-opts'>" + opts + "</div>" +
      "<button onclick='closeSettle()' style='width:100%;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Скасувати</button>" +
    "</div>";
  body.appendChild(wrap);
}
async function assignMaster(num, itemIdx, action, master) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const it = its[itemIdx];
  if (!it) return;
  const nowVal = new Date().toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric"}) + " " + new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  const status = action === "work" ? "⚙️ В роботі" : "📦 Виданий";
  it["Статус"] = status;
  if (action === "work") { it["Майстер"] = master; it["Дата в роботі"] = nowVal; }
  else { it["Хто видав"] = master; it["Дата видачі"] = nowVal; }
  // Видача без попереднього сповіщення — закриваємо "хвіст": клієнт і так забрав річ,
  // нема сенсу далі показувати "не сповіщено" по факту вже виданого замовлення.
  const wasNotified = action === "issue" ? !!gv(it,"Сповіщено") : true;
  if (action === "issue" && !wasNotified) it["Сповіщено"] = nowVal;
  closeSettle();
  openOrder(num);
  const itemNum = gv(it,"Номер виробу") || (num + "-" + (itemIdx+1));
  try {
    await fetch(API_URL.replace("/order","/status"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ item_num: itemNum, status: status, master: master })
    });
    if (action === "issue" && !wasNotified) {
      await fetch(API_URL.replace("/order","/notify"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ item_num: itemNum, notified: true })
      });
    }
  } catch(e) { console.error("assign master failed", e); }
}

/* Зміна статусу виробу (запис через API) */

/* ═══════════════ СТАТУС ОКРЕМОЇ ПОСЛУГИ ═══════════════ */
/* Дія «В роботу» — спершу питаємо, хто бере (майстер), потім переводимо статус.
   «Готово» — без вибору майстра (той, хто взяв, той і завершує). */
function svcAction(svcNum, action) {
  if (action === "ready") { confirmServiceStatus(svcNum, "✅ Готово", ""); return; }
  // action === "work": вибір майстра
  const names = masterNamesForRole();
  if (!isAdmin() && names.length === 1) { confirmServiceStatus(svcNum, "⚙️ В роботі", names[0]); return; }
  const bg = document.getElementById("odm-bg");
  if (!bg.classList.contains("open")) { bg.classList.add("open"); settleOwnsModal = true; }
  const body = document.getElementById("odm-body");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  const opts = names.length
    ? names.map(m => "<button class='rating-opt' onclick=\"confirmServiceStatus('" + svcNum + "','⚙️ В роботі','" + m.replace(/'/g,"\\'") + "')\">" + m + "</button>").join("")
    : (masterNames().length ? "<div class='d-bonus-hint'>Для вашого акаунта немає доступного майстра</div>" : "<div class='d-bonus-hint'>Додайте майстрів у лист «Майстри»</div>");
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Хто бере послугу в роботу?</div>" +
      "<div class='rating-opts'>" + opts + "</div>" +
      "<button onclick='closeSettle()' style='width:100%;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Скасувати</button>" +
    "</div>";
  body.appendChild(wrap);
}
async function confirmServiceStatus(svcNum, status, master) {
  closeSettle();
  const sv = SERVICES.find(s => gv(s,"Номер послуги") === svcNum);
  if (!sv) return;
  const nowVal = new Date().toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"}) + " " + new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  sv["Статус"] = status;
  if (status === "⚙️ В роботі") { if (master) sv["Майстер"] = master; sv["Дата в роботі"] = nowVal; }
  else if (status === "✅ Готово") { sv["Дата готово"] = nowVal; }
  rollUpItemStatus(gv(sv,"Номер виробу"));
  if (detailOrderNum) openOrder(detailOrderNum);
  if (currentPage === "myworks") renderers.myworks();
  if (currentPage === "assign") renderers.assign();
  try {
    await fetch(API_URL.replace("/order","/service/status"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ svc_num: svcNum, status: status, master: master })
    });
  } catch(e) { console.error("service status failed", e); }
}
/* Прямий клік по кроку рейки послуги (для відкату — лише адмін) */
async function setServiceStatus(svcNum, statusIdx) {
  const sv = SERVICES.find(s => gv(s,"Номер послуги") === svcNum);
  if (!sv) return;
  const curIdx = serviceStatusIndex(gv(sv,"Статус"));
  if (statusIdx < curIdx && !isAdmin()) { toast("Скасувати статус може лише адміністратор"); return; }
  if (statusIdx === curIdx) return;
  const status = SERVICE_STATUSES[statusIdx][0];
  if (statusIdx === 1) { svcAction(svcNum, "work"); return; }
  confirmServiceStatus(svcNum, status, gv(sv,"Майстер"));
}
/* Локальний перерахунок статусу виробу зі статусів його послуг (дзеркалить бекенд) */
function rollUpItemStatus(itemNum) {
  const svcs = servicesOfItem(itemNum);
  if (!svcs.length) return;
  const it = ITEMS.find(i => gv(i,"Номер виробу") === itemNum);
  if (!it || gv(it,"Статус") === "📦 Виданий") return;
  const idxs = svcs.map(s => serviceStatusIndex(gv(s,"Статус")));
  let st = "🆕 Новий";
  if (idxs.every(i => i === 2)) st = "✅ Готово";
  else if (idxs.some(i => i >= 1)) st = "⚙️ В роботі";
  it["Статус"] = st;
}

async function toggleNotified(itemNum, itemIdx, ev) {
  if (ev) ev.stopPropagation();
  const it = ITEMS.find(i => gv(i,"Номер виробу") === itemNum);
  if (!it) return;
  const currently = !!gv(it,"Сповіщено");
  if (currently) {
    if (!isAdmin()) { toast("Зняти позначку сповіщення може лише адміністратор"); return; }
    it["Сповіщено"] = ""; it["Хто сповістив"] = "";
    if (detailOrderNum) openOrder(detailOrderNum);
    try {
      await fetch(API_URL.replace("/order","/notify"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ item_num: itemNum, notified: false })
      });
    } catch(e) { console.error("notify unmark failed", e); }
    return;
  }
  // Хто прийняв замовлення — той і сповіщає клієнта, без зайвого вибору зі списку
  const orderNum = gv(it,"Номер замовлення");
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === orderNum);
  const receiver = o ? gv(o,"Приймальник") : "";
  if (receiver) { confirmToggleNotified(itemNum, receiver); return; }
  pickNotifier('item', itemNum);
}
async function confirmToggleNotified(itemNum, who) {
  closeSettle();
  const it = ITEMS.find(i => gv(i,"Номер виробу") === itemNum);
  if (!it) return;
  const nowVal = new Date().toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"}) + " " + new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  it["Сповіщено"] = nowVal; it["Хто сповістив"] = who;
  if (detailOrderNum) openOrder(detailOrderNum);
  if (currentPage === "todayplan") renderers.todayplan();
  try {
    await fetch(API_URL.replace("/order","/notify"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ item_num: itemNum, notified: true, notified_by: who })
    });
  } catch(e) { console.error("notify mark failed", e); }
}

async function markAllNotified(num, notified) {
  if (!notified) {
    if (!isAdmin()) { toast("Зняти позначку сповіщення може лише адміністратор"); return; }
    const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
    its.forEach(it => { it["Сповіщено"] = ""; it["Хто сповістив"] = ""; });
    if (detailOrderNum) openOrder(detailOrderNum);
    for (const it of its) {
      const itemNum = gv(it,"Номер виробу");
      try {
        await fetch(API_URL.replace("/order","/notify"), {
          method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ item_num: itemNum, notified: false })
        });
      } catch(e) { console.error("notify-all unmark failed for", itemNum, e); }
    }
    return;
  }
  // Хто прийняв замовлення — той і сповіщає клієнта, без зайвого вибору зі списку
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  const receiver = o ? gv(o,"Приймальник") : "";
  if (receiver) { confirmMarkAllNotified(num, receiver); return; }
  pickNotifier('order', num);
}
async function confirmMarkAllNotified(num, who) {
  closeSettle();
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const nowVal = new Date().toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"}) + " " + new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  its.forEach(it => { it["Сповіщено"] = nowVal; it["Хто сповістив"] = who; });
  if (detailOrderNum) openOrder(detailOrderNum);
  for (const it of its) {
    const itemNum = gv(it,"Номер виробу");
    try {
      await fetch(API_URL.replace("/order","/notify"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ item_num: itemNum, notified: true, notified_by: who })
      });
    } catch(e) { console.error("notify-all failed for", itemNum, e); }
  }
}

/* Спільний попап вибору «хто відзначає» сповіщення — той самий стиль,
   що й вибір майстра при видачі (confirmIssueWholeOrder). kind: 'item' | 'order' */

    : "<div class='d-bonus-hint'>Додайте майстрів у лист «Майстри»</div>";

/* ═══════ ІНЛАЙН-ПАНЕЛЬ СПИСАННЯ БОНУСІВ (поруч із кнопкою оплати) ═══════
   На відміну від попередньої версії — не окреме модальне вікно, а розгортання
   прямо в картці, з наочним розрахунком «Було → Списано → Нова сума». */
function toggleBonusCalc(num) {
  const panel = document.getElementById("bonus-calc-panel");
  if (!panel) return;
  if (panel.innerHTML) { panel.innerHTML = ""; return; }
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const phone = gv(o,"Телефон");
  const total = orderTotal(num);
  const payStatus = computePayStatus(total, gv(o,"Оплата"), extractAmt(gv(o,"Оплата")), extractAmt(gv(o,"Сума доплати")));
  const toPay = payStatus.toPay;
  const balance = clientBonusBalance(phone);
  const maxByOrder = Math.floor(total * BONUS_SPEND_CAP / 100);
  const maxSpend = Math.min(balance, maxByOrder, toPay);
  panel.innerHTML =
    "<div class='bonus-calc'>" +
      "<div class='dblock-label' style='color:#2FA98C'>Списати бонуси</div>" +
      "<div style='font-size:11px;color:var(--txt-3);margin-bottom:8px'>Доступно " + balance.toLocaleString("uk-UA") + " балів · максимум для цього чека (" + BONUS_SPEND_CAP + "%): " + maxByOrder.toLocaleString("uk-UA") + "</div>" +
      "<input class='cr-input bonus-spend-input' id='bonus-spend-amt' type='number' value='" + maxSpend + "' max='" + maxSpend + "' min='0' oninput=\"updateBonusCalcPreview(" + toPay + ")\">" +
      "<div id='bonus-calc-preview'></div>" +
      "<div style='display:flex;gap:8px;margin-top:10px'>" +
        "<button onclick='toggleBonusCalc(\"" + num + "\")' style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:10px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Скасувати</button>" +
        "<button class='d-bonus-apply-btn' onclick=\"applyBonusSpend('" + num + "'," + maxSpend + "," + toPay + ")\">Застосувати</button>" +
      "</div>" +
    "</div>";
  updateBonusCalcPreview(toPay);
}
function updateBonusCalcPreview(toPay) {
  const input = document.getElementById("bonus-spend-amt");
  const prev = document.getElementById("bonus-calc-preview");
  if (!input || !prev) return;
  let amt = parseInt(input.value || "0");
  const max = parseInt(input.getAttribute("max") || "0");
  if (amt > max) amt = max;
  if (amt < 0) amt = 0;
  const newAmt = Math.max(0, toPay - amt);
  prev.innerHTML =
    "<div class='bonus-calc-preview'>" +
      "<div class='bcp-row'><span>Було</span><span>" + toPay.toLocaleString("uk-UA") + " ₴</span></div>" +
      "<div class='bcp-row spend'><span>Списано бонусами</span><span>− " + amt.toLocaleString("uk-UA") + " ₴</span></div>" +
      "<div class='bcp-row total'><span>Нова сума до сплати</span><span>" + newAmt.toLocaleString("uk-UA") + " ₴</span></div>" +
    "</div>";
}
async function applyBonusSpend(num, maxSpend, toPay) {
  let amt = parseInt(document.getElementById("bonus-spend-amt").value || "0");
  if (amt > maxSpend) amt = maxSpend;
  if (amt < 0) amt = 0;
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (o && amt > 0) o["Списано бонусів"] = String(amt);
  openOrder(num);
  if (amt > 0) {
    try {
      await fetch(API_URL.replace("/order","/bonus"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ order_num: num, spent: amt })
      });
    } catch(e) { console.error("bonus spend failed", e); }
  }
}

function setSettleMethod(m, btn) {
  settleState.method = m;
  btn.parentElement.querySelectorAll(".cr-pill").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const infoBox = document.getElementById("settle-card-info");
  if (infoBox) infoBox.innerHTML = (m === "Картка" && payConfigured()) ? "<div class='settle-card-req'>" + payPanelHTML() + "</div>" : (m === "ФОП" && fopConfigured()) ? "<div class='settle-card-req'>" + fopPanelHTML() + "</div>" : "";
}
let settleOwnsModal = false;
function closeSettle() {
  const ov = document.querySelector(".settle-overlay");
  if (ov) ov.remove();
  if (settleOwnsModal) { document.getElementById("odm-bg").classList.remove("open"); settleOwnsModal = false; }
}
async function confirmSettle() {
  const amt = parseInt(document.getElementById("settle-amt").value || "0");
  if (!amt) { alert("Вкажіть суму"); return; }
  if (!settleState.method) { alert("Оберіть спосіб оплати"); return; }
  const num = settleState.num;
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (o) { o["Сума доплати"] = String(amt); o["Спосіб доплати"] = settleState.method; }
  closeSettle();
  openOrder(num);
  try {
    await fetch(API_URL.replace("/order","/settle"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: num, amount: amt, method: settleState.method })
    });
  } catch(e) { console.error("settle failed", e); }

  // Якщо це фінальний платіж (замовлення тепер повністю оплачене) — пропонуємо нарахувати бонуси.
  // Списання вже відбулось (якщо клієнт погодився) ДО прийняття оплати — startSettleFlow.
  if (o) {
    const total = orderTotal(num);
    const payStr = gv(o,"Оплата");
    const prepayAmt = extractAmt(payStr);
    const status = computePayStatus(total, payStr, prepayAmt, amt);
    if (status.isPaid) promptAccrueStep(num, total);
  }
}

function promptAccrueStep(num, total) {
  if (detailOrderNum) openOrder(detailOrderNum);
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const accrued = extractAmt(gv(o,"Нараховано бонусів"));
  if (accrued) return;
  const phone = gv(o,"Телефон");
  const clientPct = bonusPctFor(phone);
  if (clientPct <= 0) return;
  const wouldAccrue = Math.round(total * clientPct / 100);
  const body = document.getElementById("odm-body");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Нарахувати бонуси?</div>" +
      "<div style='font-size:12px;color:var(--txt-2);margin-bottom:10px'>" + clientPct + "% від суми чека — за статусом клієнта.</div>" +
      "<input class='cr-input' id='accrue-amt' type='number' value='" + wouldAccrue + "'>" +
      "<div style='display:flex;gap:8px;margin-top:10px'>" +
        "<button onclick='skipAccrueStep()' style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Пропустити</button>" +
        "<button class='d-settle-btn' style='flex:2;margin-top:0;background:#2FA98C' onclick=\"confirmAccrueStep('" + num + "')\">Нарахувати</button>" +
      "</div>" +
    "</div>";
  body.appendChild(wrap);
}
async function confirmAccrueStep(num) {
  const amt = parseInt(document.getElementById("accrue-amt").value || "0");
  closeSettle();
  if (amt > 0) {
    const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
    if (o) o["Нараховано бонусів"] = String(amt);
    if (detailOrderNum) openOrder(detailOrderNum);
    try {
      await fetch(API_URL.replace("/order","/bonus"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ order_num: num, accrued: amt })
      });
    } catch(e) { console.error("accrue failed", e); }
  }
}
function skipAccrueStep() {
  closeSettle();
}

/* ─── РУЧНИЙ РЕЙТИНГ КЛІЄНТА ─── */
function openRatingPick(phone, containerId, mode) {
  if (!isAdmin()) return;
  containerId = containerId || "odm-body";
  mode = mode || "order";
  const cur = manualRating(phone);
  const body = document.getElementById(containerId);
  if (!body) return;
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  const opt = (key, label, dot) =>
    "<button class='rating-opt" + (cur===key?" on":"") + "' onclick=\"saveRating('" + phone.replace(/'/g,"") + "','" + key + "','" + mode + "')\">" +
      "<span style='font-size:16px'>" + dot + "</span>" + label + "</button>";
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Статус клієнта</div>" +
      "<div class='rating-opts'>" +
        opt("green","Розраховується","🟢") + opt("yellow","Звичайний","🟡") + opt("red","Є борг","🔴") +
      "</div>" +
      "<button class='rating-auto" + (!cur?" on":"") + "' onclick=\"saveRating('" + phone.replace(/'/g,"") + "','','" + mode + "')\">Автоматично (за розрахунками)</button>" +
      "<button onclick='closeSettle()' style='width:100%;margin-top:10px;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Скасувати</button>" +
    "</div>";
  body.appendChild(wrap);
}

async function saveRating(phone, rating, mode) {
  // локально: пишемо в останнє замовлення цього телефону
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone);
  if (orders.length) orders[orders.length-1]["Рейтинг вручну"] = rating;
  closeSettle();
  if (mode === "client") { if (typeof openClientEdit === "function") openClientEdit(phone); }
  else if (detailOrderNum) openOrder(detailOrderNum);
  else if (renderers[currentPage]) renderers[currentPage]();
  try {
    await fetch(API_URL.replace("/order","/client/rating"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ phone: phone, rating: rating })
    });
  } catch(e) { console.error("rating save failed", e); }
}

/* ─── БОНУСИ: нарахування з можливістю змінити суму ─── */

function openSpendBonus(num, balance, total) {
  if (!isAdmin()) { toast("Бонуси доступні лише адміністратору"); return; }
  // Ліміт списання 30% від суми чека
  const maxByOrder = Math.floor(total * BONUS_SPEND_CAP / 100);
  const maxSpend = Math.min(balance, maxByOrder);
  const body = document.querySelector("#bonus-modal.open .odm-scroll") || document.getElementById("odm-body");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Списати бали</div>" +
      "<div style='font-size:12px;color:var(--txt-2);margin-bottom:10px'>Доступно: " + balance + " · макс. для цього чека (" + BONUS_SPEND_CAP + "%): " + maxByOrder + "</div>" +
      "<input class='cr-input' id='spend-amt' type='number' value='" + maxSpend + "' max='" + maxSpend + "'>" +
      "<div style='display:flex;gap:8px;margin-top:10px'>" +
        "<button onclick='closeSettle()' style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Скасувати</button>" +
        "<button class='d-settle-btn' style='flex:2;margin-top:0' onclick=\"confirmSpendBonus('" + num + "'," + maxSpend + ")\">Списати</button>" +
      "</div>" +
    "</div>";
  body.appendChild(wrap);
}
async function confirmSpendBonus(num, maxSpend) {
  let amt = parseInt(document.getElementById("spend-amt").value || "0");
  if (!amt) { alert("Вкажіть суму"); return; }
  if (amt > maxSpend) amt = maxSpend;
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (o) o["Списано бонусів"] = String(amt);
  closeSettle();
  openOrder(num);
  try {
    await fetch(API_URL.replace("/order","/bonus"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: num, spent: amt })
    });
  } catch(e) { console.error("spend failed", e); }
}
const NOTIFY_TEMPLATES = {
  ready:    (v, num, item) => "Доброго дня, " + v + "! Ваше замовлення " + num + " (" + item + ") готове до видачі. Чекаємо вас у Rewise Studio. Дякуємо, що обрали нас.",
  remind:   (v, num, item) => "Доброго дня, " + v + "! Нагадуємо, що ваше замовлення " + num + " (" + item + ") готове та очікує на видачу в Rewise Studio.",
  accepted: (v, num, item) => "Доброго дня, " + v + "! Ваше замовлення " + num + " (" + item + ") прийнято в роботу. Повідомимо, щойно буде готове. Rewise Studio."
};
function copyNotify(num, type) {
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const v = vocative(gv(o,"Ім'я клієнта"));
  const shortNum = num.replace("RW-","№");
  const item = orderItemName(num);
  const text = NOTIFY_TEMPLATES[type](v, shortNum, item);
  copyToClipboard(text);
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("Текст скопійовано")).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Текст скопійовано"); } catch(e) { alert(text); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById("rw-toast");
  if (!t) { t = document.createElement("div"); t.id = "rw-toast"; document.body.appendChild(t); }
  t.textContent = msg; t.className = "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", 2000);
}

    }
  }
})();
