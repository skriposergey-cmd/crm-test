}

/* "Передплата" — актуальний правопис (як "Післяплата", без "о").
   Стару "Передоплата" теж розпізнаємо — так підписані вже наявні замовлення в таблиці. */
function isPrepayStr(s) { return !!(s && (s.includes("Передплата") || s.includes("Передоплата"))); }

/* ─── СТАТУСИ ─── */
function getStatus(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  if (!its.length) return "new";
  const issued = its.filter(i => gv(i,"Статус") === "📦 Виданий").length;
  if (issued === its.length) return "issued";
  if (issued > 0) return "partial";
  if (its.some(i => gv(i,"Статус") === "✅ Готово")) return "ready";
  if (its.some(i => gv(i,"Статус") === "⚙️ В роботі")) return "work";
  if (its.some(i => gv(i,"Статус") === "⏳ Відкладено")) return "postponed";
  return "new";
}
const STATUS_META = {
  new:["Новий","b-new"], work:["В роботі","b-work"], ready:["Готово","b-ready"],
  issued:["Виданий","b-issued"], partial:["Частково видано","b-partial"], postponed:["Відкладено","b-postponed"]
};
const STATUS_ACCENT = { new:"#378ADD", work:"#EF9F27", ready:"#639922", issued:"#B4B2A9", partial:"#2FA98C", postponed:"#E24B4A" };

/* Чи горить термін: термінові — завжди, звичайні — за 3 дні до дати */
function deadlineWarn(o) {
  const term = gv(o,"Термін");
  if (getStatus(gv(o,"Номер замовлення")) === "issued") return false;
  if (term.includes("Терміново")) return true;
  const d = parseDeadline(term);
  if (!d) return false;
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = (d - now) / 86400000;
  return diff >= 0 && diff <= 3;
}
function parseDeadline(str) {
  if (!str) return null;
  const m = str.match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?/);
  if (!m) return null;
  const day = parseInt(m[1]), mon = parseInt(m[2]) - 1;
  let year = m[3] ? parseInt(m[3]) : new Date().getFullYear();
  if (year < 100) year += 2000;
  return new Date(year, mon, day);
}

function statusBadge(num) {
  const m = STATUS_META[getStatus(num)];
  return "<span class='badge " + m[1] + "'>" + m[0] + "</span>";
}

/* Послуги замовлення одним рядком */
function orderServices(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const names = [];
  its.forEach(i => {
    (gv(i,"Послуги") || "").split(",").forEach(s => {
      const k = s.trim().split("—")[0].trim();
      if (k && names.indexOf(k) === -1) names.push(k);
    });
  });
  return names.slice(0,3).join(", ") || "—";
}
function pluralUk(n, one, few, many) {
  const a = Math.abs(n) % 100, a1 = a % 10;
  if (a > 10 && a < 20) return many;
  if (a1 > 1 && a1 < 5) return few;
  if (a1 === 1) return one;
  return many;
}
function orderItemCount(num) {
  return ITEMS.filter(i => gv(i,"Номер замовлення") === num).length;
}
function orderItemName(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  if (!its.length) return "—";
  const first = its[0];
  const t = gv(first,"Тип"), b = gv(first,"Бренд");
  let name = [t, b].filter(Boolean).join(" · ") || "Виріб";
  if (its.length > 1) {
    const extra = its.length - 1;
    name += " +" + extra + " " + pluralUk(extra, "виріб", "вироби", "виробів");
  }
  return name;
}
function orderMaster(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  for (let k = 0; k < its.length; k++) { const m = gv(its[k],"Майстер"); if (m) return m; }
  return "";
}

const CATEGORY_LABELS = { shoes: "Взуття", bags: "Аксесуари" };
let PRICE = {};
let priceLoaded = false;

async function loadPrice() {
  try {
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&gid=" + PRICE_GID;
    const r = await fetchWithRetry(url, { cache: "no-store" });
    const txt = await r.text();
    const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
    PRICE = {};
    // шукаємо колонку "Активна" за назвою в шапці
    let activeIdx = -1;
    let termIdx = -1;
    let fromIdx = -1;
    if (json.table && json.table.cols) {
      json.table.cols.forEach(function(col, i){
        const lbl = String((col && col.label) || "").trim().toLowerCase();
        if (lbl === "активна" || lbl === "активність" || lbl === "active") activeIdx = i;
        if (termIdx === -1 && (lbl.indexOf("термін") !== -1 || lbl.indexOf("строк") !== -1 || lbl.indexOf("срок") !== -1 || lbl.indexOf("виконан") !== -1)) termIdx = i;
        if (fromIdx === -1 && (lbl === "від" || lbl.indexOf("від") !== -1)) fromIdx = i;
      });
    }
    json.table.rows.forEach(function(row){
      const c = row.c; if (!c) return;
      const category = c[0] && c[0].v ? String(c[0].v).trim() : "";
      const deptName = c[2] && c[2].v ? String(c[2].v).trim() : "";
      const svcName  = c[3] && c[3].v ? String(c[3].v).trim() : "";
      const unit     = c[4] && c[4].v ? String(c[4].v).trim() : "";
      const price    = c[5] && c[5].v != null ? parseInt(c[5].v) : 0;
      let active = true;
      if (activeIdx >= 0 && c[activeIdx] && c[activeIdx].v != null) {
        const v = String(c[activeIdx].v).trim().toLowerCase();
        active = !(v === "ні" || v === "no" || v === "false" || v === "0");
      }
      let term = "";
      if (termIdx >= 0 && c[termIdx] && c[termIdx].v != null) term = gvizDate(String(c[termIdx].v).trim());
      let priceFrom = false;
      if (fromIdx >= 0 && c[fromIdx] && c[fromIdx].v != null) {
        const v = String(c[fromIdx].v).trim().toLowerCase();
        priceFrom = (v === "так" || v === "yes" || v === "true" || v === "1");
      }
      if (!category || !deptName || !svcName) return;
      if (!PRICE[category]) PRICE[category] = { label: CATEGORY_LABELS[category] || category, departments: {} };
      if (!PRICE[category].departments[deptName]) PRICE[category].departments[deptName] = [];
      PRICE[category].departments[deptName].push({ name: svcName, price: price, unit: unit, active: active, term: term, from: priceFrom });
    });
    priceLoaded = true;
    if (["create","settings","pricelist"].includes(currentPage)) renderers[currentPage]();
  } catch(err) {
    console.error("Price load error:", err);
    // НЕ виставляємо priceLoaded=true при збої — інакше addItem() почне
    // створювати речі з неіснуючою категорією (звідси порожні картки).
    // Замість цього — видиме попередження і повтор через кілька секунд.
    if (typeof toast === "function") toast("Не вдалося завантажити прайс. Спробуємо ще раз...");
    setTimeout(loadPrice, 3000);
  }
}

   підстраховуємось звичайним посиланням t.me. */
function openMessenger(key, phoneClean) {
  if (key === "whatsapp") { window.location.href = "whatsapp://send?phone=" + phoneClean; return; }
  if (key === "viber") { window.location.href = "viber://chat?number=%2B" + phoneClean; return; }
  let landed = false;
  const markLanded = function () { landed = true; };
  document.addEventListener("visibilitychange", markLanded, { once: true });
  window.location.href = "tg://resolve?phone=" + phoneClean;
  setTimeout(function () {
    document.removeEventListener("visibilitychange", markLanded);
    if (!landed) window.location.href = "https://t.me/+" + phoneClean;
  }, 1200);
}

function firstCategory() { const k = Object.keys(PRICE); return k.length ? k[0] : ""; }
function firstDept(cat) { if (!PRICE[cat]) return ""; const k = Object.keys(PRICE[cat].departments); return k.length ? k[0] : ""; }
function itemServices(item) {
  const c = PRICE[item.category];
  const list = c ? (c.departments[item.department] || []) : [];
  return list.filter(s => s.active !== false);
}
/* Плоский список УСІХ активних послуг по всій базі (всі категорії, всі відділи) —
   для глобального пошуку в «Додати ще одну послугу», щоб не прив'язуватись до відділу. */
/* Унікальні "відділи" (типи послуг: Чищення/Ремонт/Пошиття...) з усього прайсу —
   для фільтра в пошуку послуги. Береться динамічно з реальних даних, нічого
   не прописано вручну, тому оновлюється сам, коли прайс міняється. */
function allDepartments(catKey) {
  const set = new Set();
  if (catKey) {
    if (PRICE[catKey]) Object.keys(PRICE[catKey].departments).forEach(d => set.add(d));
  } else {
    Object.keys(PRICE).forEach(cat => {
      Object.keys(PRICE[cat].departments).forEach(d => set.add(d));
    });
  }
  return Array.from(set);
}
function allServicesFlat(catKey) {
  const out = [];
  const cats = catKey ? [catKey] : Object.keys(PRICE);
  cats.forEach(cat => {
    const c = PRICE[cat];
    if (!c) return;
    Object.keys(c.departments).forEach(dept => {
      c.departments[dept].forEach(s => {
        if (s.active !== false) out.push({ name: s.name, price: s.price, unit: s.unit, category: c.label, catKey: cat, department: dept, from: s.from });
      });
    });
  });
  return out;
}

    return "<button class='d-bonus-spend-btn' style='margin-top:10px;width:100%' onclick='toggleNewOrderBonus()'>Списати бонуси (" + balance.toLocaleString("uk-UA") + ")</button>";

function toggleNewOrderBonus() {
  NO.bonusOpen = !NO.bonusOpen;

    const balance = NO.phone ? clientBonusBalance(NO.phone) : 0;

    NO.bonusSpent = Math.min(balance, Math.floor(total * BONUS_SPEND_CAP / 100), total);

function setNewOrderBonusAmt(v, total, maxSpend) {
  let amt = parseInt(v || "0");

  if (amt > maxSpend) amt = maxSpend;

/* Знайти месенджер клієнта з останнього замовлення */
function clientMessenger(phone) {
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone && gv(o,"Месенджер"));
  if (!orders.length) return "";
  return gv(orders[orders.length - 1], "Месенджер");
}
/* Те саме для дня народження і пошти клієнта — поля пишуться так само,
   як месенджер, в останнє замовлення цього телефону (колонки 19/20). */
function clientBirthday(phone) {
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone && gv(o,"День народження"));
  if (!orders.length) return "";
  return gv(orders[orders.length - 1], "День народження");
}
function clientMailAddress(phone) {
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone && gv(o,"Пошта"));
  if (!orders.length) return "";
  return gv(orders[orders.length - 1], "Пошта");
}

/* Автопідстановка клієнта за історією замовлень */
function knownClients() {
  const map = {};
  ORDERS.forEach(o => {
    const phone = gv(o,"Телефон"), name = gv(o,"Ім'я клієнта");
    if (phone && !map[phone]) map[phone] = { name: name, phone: phone };
  });
  TAILOR.forEach(t => {
    const phone = gv(t,"Телефон"), name = gv(t,"Ім'я клієнта");
    if (phone && !map[phone]) map[phone] = { name: name, phone: phone };
  });
  return Object.values(map);
}

function onPhoneInput(v) {

function showClientSuggest(q, field) {
  const dd = document.getElementById("cr-suggest");
  if (!dd) return;
  q = q.trim().toLowerCase();
  if (!q) { dd.classList.remove("open"); return; }
  const matches = knownClients().filter(c =>
    (field === "phone" ? c.phone : c.name).toLowerCase().includes(q)
  ).slice(0, 5);
  if (!matches.length) { dd.classList.remove("open"); return; }
  dd.innerHTML = matches.map(c =>
    "<div class='cr-suggest-opt' onclick=\"pickClient('" + c.phone.replace(/'/g,"") + "')\"><span>" + c.name + "</span><span class='sug-phone'>" + fmtPhone(c.phone) + "</span></div>"
  ).join("");
  dd.classList.add("open");
}
function pickClient(phone) {
  const c = knownClients().find(x => x.phone === phone);

/* ─── Вибір моделі (з листа «Види») ─── */
function openModelDD(id) { renderModelDD(id, ""); const dd = document.getElementById("ic-mdd-"+id); if (dd) dd.classList.add("open"); }
function filterModel(id) { const inp = document.getElementById("ic-model-"+id); renderModelDD(id, inp ? inp.value : ""); const dd = document.getElementById("ic-mdd-"+id); if (dd) dd.classList.add("open"); }
function renderModelDD(id, query) {
  const it = NO.items.find(i=>i.id===id); const dd = document.getElementById("ic-mdd-"+id);
  if (!it || !dd) return;
  const list = modelsFor(it.category);
  const q = (query||"").trim().toLowerCase();
  if (!list.length) {
    dd.innerHTML = q
      ? "<div class='ic-opt' onclick=\"pickModel(" + id + ",'" + q.replace(/'/g,"\\'").replace(/\"/g,"&quot;") + "')\"><span class='o-name'>+ Додати «" + query.trim() + "» як новий вид</span></div>"
      : "<div class='ic-opt'><span class='o-empty'>Лист «Види» порожній</span></div>";
    return;
  }
  let html = "", shown = 0;
  list.forEach(v => {
    const t = v["Тип"];
    if (q && t.toLowerCase().indexOf(q) === -1) return;
    shown++;
    const sub = (it.category === "bags" && t !== "Поясний ремінь") ? ("розмір " + (v["Розмір"]||"?")) : (v["Розмір"]||"");
    html += "<div class='ic-opt' onclick=\"pickModel(" + id + ",'" + t.replace(/'/g,"\\'") + "')\"><span class='o-name'>" + t +
      (sub ? "<span class='o-hint'>" + sub + "</span>" : "") + "</span></div>";
  });
  // Якщо ввели текст і серед готових видів немає точного збігу — дозволяємо додати свій
  const exactMatch = q && list.some(v => v["Тип"].toLowerCase() === q);
  if (q && !exactMatch) {
    html += "<div class='ic-opt' onclick=\"pickModel(" + id + ",'" + query.trim().replace(/'/g,"\\'") + "')\"><span class='o-name'>+ Додати «" + query.trim() + "» як новий вид</span></div>";
  }
  dd.innerHTML = html || "<div class='ic-opt'><span class='o-empty'>Нічого не знайдено</span></div>";
}
function pickModel(id, type) {
  const it = NO.items.find(i=>i.id===id); if (!it) return;
  it.model = type;
  const info = modelInfo(it.category, type);
  const isBelt = it.category === "bags" && type === "Поясний ремінь";
  if (info) it.size = info["Розмір"] || (it.category === "bags" && !isBelt ? "M" : "");
  recomputeCore(it);
  const dd = document.getElementById("ic-mdd-"+id); if (dd) dd.classList.remove("open");
  renderItems(); updateReceipt();
}
function setItemSize(id, size) { const it = NO.items.find(i=>i.id===id); if (!it) return; it.size = size; recomputeCore(it); renderItems(); updateReceipt(); }
function setItemMaterial(id, mat) { const it = NO.items.find(i=>i.id===id); if (!it) return; it.material = mat; recomputeCore(it); renderItems(); updateReceipt(); }
function toggleOp(id, op) {
  const it = NO.items.find(i=>i.id===id); if (!it) return;
  const idx = it.services.findIndex(s => s.kind === "core" && s.op === op);
  if (idx >= 0) { it.services.splice(idx,1); renderItems(); updateReceipt(); return; }
  if (!it.model) { toast("Спочатку оберіть вид виробу"); return; }
  const p = opPriceFor(it, op);
  if (!p) { toast("Немає ціни для «" + op + "» цього виду/розміру"); return; }
  it.services = it.services.filter(s => s.kind !== "core"); // один рівень одразу — наступний включає попередній
  it.services.push({ kind:"core", op:op, name: coreLineName(it, op), price: parseInt(p.price)||0 });
  renderItems(); updateReceipt();
}
function setItemMode(id, mode) {
  const it = NO.items.find(i=>i.id===id); if (!it) return;
  it.mode = mode;
  // Ремонт не має карток швидких послуг — одразу розкриваємо пошук, щоб не тиснути «Додати»
  if (mode === "repair") it.addSvcOpen = true;
  renderItems(); updateReceipt();
}

function editSvcPrice(itemId, idx, el) {
  const it = NO.items.find(i=>i.id===itemId);
  if (!it || !it.services[idx]) return;
  const cur = it.services[idx].price;
  openPriceKeypad(cur, null, function(finalValue) {
    const v = parseInt(finalValue);
    it.services[idx].price = (!isNaN(v) && v >= 0) ? v : cur;
    renderItems(); updateReceipt();
  }, el);
}

function renderSvcDD(id, query, catFilter) {
  const it = NO.items.find(i=>i.id===id);
  const dd = document.getElementById("ic-dd-"+id);
  if (!it || !dd) return;
  let services = allServicesFlat(it.category);
  if (catFilter) {
    services = services.filter(s => s.department === catFilter);
  }
  const q = query.trim().toLowerCase();
  if (!q) { dd.innerHTML = "<div class='ic-opt'><span class='o-empty'>Почніть вводити назву послуги</span></div>"; return; }
  const words = q.split(/\s+/).filter(w => w.length);
  let html = "", shown = 0;
  services.forEach((s, i) => {
    const nameLC = s.name.toLowerCase();
    const matchesAll = words.every(w => nameLC.indexOf(w) !== -1);
    if (!matchesAll) return;
    if (++shown > 40) return; // не рендеримо забагато рядків одразу
    const hint = s.category + " · " + s.department;
    const priceLbl = (s.from ? "від " : "") + s.price + " ₴";
    const nameAttr = s.name.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    html += "<div class='ic-opt' onclick='selectSvcByName(" + id + ",\"" + nameAttr + "\"," + s.price + ")'><span class='o-name'>" + s.name +
      "<span class='o-hint'>" + hint + "</span></span><span class='o-price'>" + priceLbl + "</span><span class='o-add'>+</span></div>";
  });
  dd.innerHTML = html || "<div class='ic-opt'><span class='o-empty'>Нічого не знайдено</span></div>";
}

function buildItemBody(item, idx) {
    const catData = PRICE[item.category]; if (!catData) return "";
    // ── Орієнтир по трьох секціях — рахуємо статуси одразу, точки вбудовуються
    //    прямо в заголовки нижче, тому завжди рівно навпроти свого блоку ──
    const doneModel = !!item.model;
    const doneSvc = item.services.length > 0;
    const doneDetails = !!(item.color || item.matNote || item.condition || (item.note && item.note.trim()));
    const railDone = [doneModel, doneSvc, doneDetails];
    let railActive = railDone.findIndex(function(d){ return !d; });
    if (railActive === -1) railActive = railDone.length - 1;
    function railDot(i, anchor) {
      const cls = (i===railActive ? " active" : "") + (railDone[i] ? " done" : "");
      return "<div class='n-dot"+cls+"' onclick=\"var _t=document.getElementById('"+anchor+"'); if(_t) _t.scrollIntoView({behavior:'smooth',block:'start'});\">" + (railDone[i] ? "✓" : (i+1)) + "</div>";
    }
    const svcRows = item.services.map((s,si) => "<div class='ic-svcrow'><span class='ic-svcnum'>"+(si+1)+".</span><span class='ic-svcname'>"+s.name+"</span><span class='ic-svcprice' onclick='editSvcPrice("+item.id+","+si+",this)'>"+s.price+" ₴</span><button class='ic-svcdel' onclick='removeSvc("+item.id+","+si+")'>×</button></div>").join("");
    const modelVal = (item.model||"").replace(/"/g,"&quot;");
    const brandVal = (item.brand||"").replace(/"/g,"&quot;");
    const isBag = item.category === "bags";
    if (!item.mode) item.mode = "care";
    const isCare = item.mode === "care";

    // ── Секція «Вид виробу» ──
    const catSeg = Object.keys(PRICE).map(function(k){return "<button class='ic-seg"+(k===item.category?" on":"")+"' onclick='changeCategory("+item.id+",\""+k+"\")'>"+PRICE[k].label+"</button>";}).join("");
    const modelSection =
      "<div class='n-sec' id='n-sec-model-"+item.id+"'>" +
        railDot(0, "n-sec-model-"+item.id) +
        "<div class='n-sec-label'>Вид виробу</div>" +
        "<div class='ic-segrow ic-catseg'>"+catSeg+"</div>" +
        "<div class='ic-row3' style='margin-top:10px'>" +
          "<div class='ic-field'><label>ВИД</label><div class='ic-search-wrap'>" +
            "<input class='ic-mini' id='ic-model-"+item.id+"' placeholder='Оберіть модель…' autocomplete='off' value=\""+modelVal+"\" oninput='filterModel("+item.id+")' onfocus='openModelDD("+item.id+")'>" +
            "<div class='ic-dd' id='ic-mdd-"+item.id+"'></div>" +
          "</div></div>" +
          "<div class='ic-field'><label>БРЕНД</label><div class='ic-search-wrap'>" +
            "<input class='ic-mini' id='ic-brand-"+item.id+"' placeholder=\"Необов'язково\" autocomplete='off' value=\""+brandVal+"\" oninput='onBrandInput("+item.id+",this.value)' onfocus='openBrandDD("+item.id+")'>" +
            "<div class='ic-dd' id='ic-bdd-"+item.id+"'></div>" +
          "</div></div>" +
        "</div>" +
      "</div>";

    // Розмір + матеріал (тільки сумки, режим догляду) — впливає на ціну послуги, тому в секції «Послуги»
    let sizeMatRow = "";
    if (isBag && isCare && item.model !== "Поясний ремінь") {
      const sizeHTML = ["S","M","L"].map(sz => "<button class='ic-seg" + (item.size===sz?" on":"") + "' onclick='setItemSize("+item.id+",\""+sz+"\")'>"+sz+"</button>").join("");
      const matHTML = [["шкіряна","Шкіра"],["текстильна","Текстиль"]].map(m => "<button class='ic-seg" + (item.material===m[0]?" on":"") + "' onclick='setItemMaterial("+item.id+",\""+m[0]+"\")'>"+m[1]+"</button>").join("");
      sizeMatRow =
        "<div class='ic-row' style='margin-bottom:14px'>" +
          "<div class='ic-field'><label>РОЗМІР</label><div class='ic-segrow'>"+sizeHTML+"</div></div>" +
          "<div class='ic-field'><label>МАТЕРІАЛ <span style=\"opacity:.6\">(для чистки)</span></label><div class='ic-segrow'>"+matHTML+"</div></div>" +
        "</div>";
    } else if (!isBag && isCare && item.model && !modelInfo(item.category, item.model)) {
      // Взуття: тарифна група визначається автоматично з листа «Види» для готових видів —
      // тоді тут нічого не показуємо. Але для власноруч уведеного виду, якого немає
      // в «Види», автоматично визначити нема з чого — попереджаємо і даємо обрати вручну.

      sizeMatRow =

          "<div class='ic-field'><label>ТАРИФНА ГРУПА</label>" +

      "</div>";

    let careBlock = "";
    if (isCare) {
      const opsHTML = CORE_OPS.map(op => {
        const added = item.services.some(s => s.kind==="core" && s.op===op);
        const p = item.model ? opPriceFor(item, op) : null;
        const priceLbl = p ? ((p.from ? "від " : "") + parseInt(p.price).toLocaleString("uk-UA") + " ₴") : "—";
        return "<button class='ic-op-tile" + (added?" on":"") + ((!p && !added)?" off":"") + "' onclick='toggleOp("+item.id+",\""+op+"\")'>" +
          (added ? "<span class='ic-op-check'>✓</span>" : "") +
          "<span class='ic-op-name'>"+op+"</span><span class='ic-op-price'>"+priceLbl+"</span></button>";
      }).join("");
      const opsHintTxt = !item.model

        : (VYDY.length ? "Натисніть, щоб додати послугу" : "додайте лист «Види», щоб працювали моделі");
      careBlock =
        sizeMatRow +
        "<div class='ic-oprow'>"+opsHTML+"</div>" +
        (opsHintTxt ? "<div class='ic-op-hint'>" + opsHintTxt + "</div>" : "") +

let MODAL_ITEM = null;

function itemTitle(item){
  var nm = (item.model && item.model.trim()) ? item.model.trim()
         : (PRICE[item.category] ? PRICE[item.category].label : "Річ");
  if (item.brand && item.brand.trim()) nm += " · " + item.brand.trim();
  return nm;
}
function itemSum(item){
  return (item.services||[]).reduce(function(s,x){ return s + (parseInt(x.price)||0); }, 0);
}
function fmtUAH(n){ return (parseInt(n)||0).toLocaleString("uk-UA") + " ₴"; }

function renderItemList(){
  const box = document.getElementById("cr-items");
  if (!box) return;
  box.innerHTML = "";
  NO.items.forEach(function(item, idx){
    const sum = itemSum(item);
    const svcs = item.services || [];
    const svcsHTML = svcs.length
      ? "<div class='icard-svcs'>" + svcs.map(function(s){
          return "<div class='icard-svc'><span class='icard-svc-name'>" + s.name + "</span><span class='icard-svc-price'>" + s.price + " ₴</span></div>";
        }).join("") + "</div>"
      : "<div class='icard-empty'>Без послуг</div>";
    const div = document.createElement("div");
    div.className = "icard";
    div.setAttribute("onclick", "openItemModal(" + item.id + ")");
    div.innerHTML =
      "<div class='icard-head'>" +
        "<span class='icard-num'>№" + (idx+1) + "</span>" +
        "<span class='icard-name'>" + itemTitle(item) + "</span>" +
        "<button class='icard-edit' onclick='event.stopPropagation();openItemModal(" + item.id + ")'>✎</button>" +
      "</div>" +
      svcsHTML +
      "<div class='icard-foot'><span class='icard-sum'>" + (sum ? fmtUAH(sum) : "—") + "</span></div>";

}

function renderItemEditor(id){
  const item = NO.items.find(function(i){ return i.id === id; });
  if (!item) { closeItemModal(); return; }
  const idx = NO.items.indexOf(item);
  ensureItemModal();
  const title = document.getElementById("iw-title");
  const body  = document.getElementById("iw-body");
  const sumEl = document.getElementById("iw-sum");
  const delBtn= document.getElementById("iw-del");
  if (title) title.innerHTML = "Річ <span>№" + (idx+1) + "</span>";
  if (body)  body.innerHTML  = buildItemBody(item, idx);
  if (sumEl) sumEl.textContent = fmtUAH(itemSum(item));
  if (delBtn) delBtn.setAttribute("onclick", "removeItem(" + item.id + "); closeItemModal();");
}

function openItemModal(id){
  MODAL_ITEM = id;

/* Нові кольори з замовлення — дописуємо в лист «Кольори» */
async function saveNewColors(items) {
  const known = new Set(colorList().map(c => c.toLowerCase()));
  const fresh = [];
  items.forEach(it => {
    const c = (it.color || "").trim();
    if (c && !known.has(c.toLowerCase())) { known.add(c.toLowerCase()); fresh.push(c); COLORS.push(c); }
  });
  if (!fresh.length) return;
  try {
    await fetch(API_URL.replace("/order","/colors/add"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ colors: fresh })
    });
  } catch(e) { console.error("colors add failed", e); }
}

/* Нові бренди з замовлення — дописуємо в лист «Бренди» */
async function saveNewBrands(items) {
  const known = new Set(BRANDS.map(b => b.toLowerCase()));
  const fresh = [];
  items.forEach(it => {
    const b = (it.brand || "").trim();
    if (b && !known.has(b.toLowerCase())) { known.add(b.toLowerCase()); fresh.push(b); BRANDS.push(b); }
  });
  if (!fresh.length) return;
  try {
    await fetch(API_URL.replace("/order","/brands/add"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ brands: fresh })
    });
  } catch(e) { console.error("brands add failed", e); }
}

async function submitOrder() {  if (!NO.manager) { alert("Оберіть приймальника"); return; }
  NO.client = document.getElementById("cr-client").value.trim();
  NO.phone = document.getElementById("cr-phone").value.trim();
  if (!NO.client) { alert("Введіть ім'я клієнта"); return; }
  if (!NO.phone) { alert("Введіть телефон"); return; }
  const validItems = NO.items.filter(i => i.services.length > 0);
  if (!validItems.length) { alert("Додайте хоча б одну послугу"); return; }
  if (!NO.payment) { alert("Оберіть тип оплати"); return; }
  if (!NO.deadline) { alert("Вкажіть термін"); return; }
  let paymentStr = NO.payment;
  if (NO.payment === "Передплата" && NO.prepay) paymentStr = "Передплата: " + parseInt(NO.prepay).toLocaleString("uk-UA") + " ₴";

  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const dateStr = pad(now.getDate())+"."+pad(now.getMonth()+1)+"."+now.getFullYear()+" "+pad(now.getHours())+":"+pad(now.getMinutes());

  const payload = {
    date: dateStr, manager: NO.manager, client: NO.client, phone: NO.phone,
    payment: paymentStr, deadline: NO.deadline, messenger: NO.messenger || "",
    delivery: NO.delivery || "Самовивіз",
    prepayMethod: NO.payment === "Передплата" ? (NO.prepayMethod || "") : "",
    prepay: NO.payment === "Передплата" && NO.prepay ? parseInt(NO.prepay) : 0,
    bonusSpent: NO.bonusSpent > 0 ? parseInt(NO.bonusSpent) : 0,
    items: validItems.map(item => {
      const total = item.services.reduce((s,x)=>s+x.price,0);
      const catLabel = PRICE[item.category] ? PRICE[item.category].label : item.category;
      return {
        type: item.model || catLabel,
        brand: item.brand || "",
        services: item.services.map(s=>s.name).join(", "),
        serviceList: item.services.map(s => ({ name: s.name, price: s.price })),
        total: total.toLocaleString("uk-UA") + " ₴",
        color: item.color || "",
        material: item.matNote || "",
        condition: item.condition || "",
        note: item.note || ""
      };
    })
  };

  const btns = document.querySelectorAll(".cr-create-btn.cr-create-mobile, .cr-create-btn.cr-create-under");
  const setBtnState = (text, disabled) => btns.forEach(b => { b.textContent = text; b.disabled = disabled; });
  setBtnState("Збереження...", true);
  try {
    const res = await fetch(API_URL, { method:"POST", mode:"cors", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
    const result = await res.json();
    if (result.status === "ok") {
      setBtnState("✓ " + (result.order_num || "Збережено"), true);
      saveNewBrands(validItems);
      saveNewColors(validItems);
      try { localStorage.removeItem("rw_draft"); } catch(e) {}
      const createdNum = result.order_num || "";
      NO = { manager: NO.manager, client:"", phone:"", messenger:"", items:[], payment:"", prepay:"", prepayMethod:"", deadline:"", delivery:"Самовивіз" };
      itemCounter = 0;
      await loadData();
      showPage("orders");
      if (createdNum) openReceiptModal(createdNum);
    } else {
      alert("Помилка: " + result.message); setBtnState("Створити замовлення", false);
    }
  } catch(e) {
    alert("Помилка збереження: " + e.message); setBtnState("Створити замовлення", false);
  }
}

/* ═══════════════ ВКЛАДКА ЗАМОВЛЕННЯ ═══════════════ */
const FILTER_DEFS = [
  ["all","Всі"], ["new","Нові"], ["work","В роботі"], ["ready","Готові"], ["issued","Видані"]
];
const PAY_FILTER_DEFS = [
  ["all","Всі"], ["paid","Оплачені"], ["unpaid","Не оплачені"]
];

renderers.orders = function() {
  const page = document.getElementById("page-orders");

  const periodOrders = ordersInPeriod(periodSel.orders);
  const counts = { all: 0, new:0, work:0, ready:0, issued:0 };
  periodOrders.forEach(o => {
    const st = getStatus(gv(o,"Номер замовлення"));
    if (counts[st] !== undefined) counts[st]++;
  });
  const activeCount = periodOrders.filter(o => getStatus(gv(o,"Номер замовлення")) !== "issued").length;
  counts.all = activeCount;
  const periodNums = new Set(periodOrders.map(o => gv(o,"Номер замовлення")));

  // Виробів по кожному статусу — рахуємо за власним статусом виробу (чесна цифра,
  // не намагається повторити складну логіку статусу замовлення).
  const itemCounts = { new:0, work:0, ready:0, issued:0 };
  ITEMS.filter(i => periodNums.has(gv(i,"Номер замовлення"))).forEach(i => {
    const ist = gv(i,"Статус");
    if (ist === "🆕 Новий") itemCounts.new++;
    else if (ist === "⚙️ В роботі") itemCounts.work++;
    else if (ist === "✅ Готово") itemCounts.ready++;
    else if (ist === "📦 Виданий") itemCounts.issued++;
  });

  const tilesHTML = FILTER_DEFS.map(([k,label]) => {
    const active = k === "all" ? ordersFilter.size === 0 : ordersFilter.has(k);
    const orderVal = k === "all" ? activeCount : (counts[k] || 0);
    const itemVal = k === "all" ? null : itemCounts[k];
    const sub = (ordersShowItems && itemVal !== null) ? "<span class='ord-tile-sub'>виробів <b>" + itemVal + "</b></span>" : "";
    return "<button class='ord-tile" + (active ? " on" : "") + "' onclick=\"setOrdersFilter('" + k + "')\">" +
      "<div class='ord-tile-label'>" + label + "</div>" +
      "<div class='ord-tile-row'><span class='ord-tile-value" + (k==="all"?" accent":"") + "'>" + orderVal + "</span>" + sub + "</div>" +
    "</button>";
  }).join("");

  const payCounts = { all: 0, paid: 0, unpaid: 0 };
  periodOrders.forEach(o => {
    const num = gv(o,"Номер замовлення");
    if (!statusVisible(num)) return;
    payCounts.all++;
    if (isOrderPaid(num)) payCounts.paid++; else payCounts.unpaid++;
  });
  const payPillHTML = "<div class='seg-pill'>" + PAY_FILTER_DEFS.map(([k,label]) =>
    "<button class='seg-btn" + (ordersPayFilter === k ? " on" : "") + "' onclick=\"setOrdersPayFilter('" + k + "')\">" + label + "</button>"
  ).join("") + "</div>";

  const itemsPillHTML = "<button class='pill-toggle" + (ordersShowItems ? " on" : "") + "' onclick='toggleOrdersItemsSub()'>" +
    "<span class='pill-dot'></span>Виробів</button>";

  page.innerHTML =
    groupSwitcher("worklist") +
    "<div class='page-header'>" +
      "<div class='page-title'>Замовлення на ремонт</div>" +
      "<div class='page-head-right'>" + payPillHTML + itemsPillHTML +
        "<button class='btn-primary' onclick=\"showPage('create')\"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='5' x2='12' y2='19'/><line x1='5' y1='12' x2='19' y2='12'/></svg>Нове замовлення</button>" +
      "</div>" +
    "</div>" +
    "<div class='ord-tiles'>" + tilesHTML + "</div>" +
    periodTabsHTML("orders") +
    "<div class='filters'>" +
      "<div class='filters-right'><div class='search-box'>" +
        "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>" +
        "<input type='text' placeholder='Пошук...' value=\"" + ordersSearch.replace(/"/g,"&quot;") + "\" oninput='onOrdersSearch(this.value)'></div></div>" +
    "</div>" +
    "<div class='orders-scroll' id='orders-scroll'></div>";

  renderOrdersList();
};

/* Єдине правило видимості за статусом: якщо фільтр не обрано — ховаємо видані,
   якщо обрано конкретні статуси — показуємо тільки їх. Використовується і у
   списку замовлень, і у підрахунку лічильників оплати, щоб вони завжди збігались. */
function statusVisible(num) {
  return ordersFilter.size === 0 ? getStatus(num) !== "issued" : ordersFilter.has(getStatus(num));
}
function setOrdersFilter(k) {
  if (k === "all") { ordersFilter.clear(); }
  else if (ordersFilter.has(k)) { ordersFilter.delete(k); }
  else { ordersFilter.add(k); }
  renderers.orders();
}
function setOrdersPayFilter(k) { ordersPayFilter = k; renderers.orders(); }
function toggleOrdersItemsSub() { ordersShowItems = !ordersShowItems; renderers.orders(); }
function onOrdersSearch(v) { ordersSearch = v; renderOrdersList(); }

function renderOrdersList() {
  const box = document.getElementById("orders-scroll");
  if (!box) return;

  if (!dataLoaded) { box.innerHTML = "<div class='orders-loading'>Завантаження...</div>"; return; }

  const q = ordersSearch.trim().toLowerCase();
  const filtered = ordersInPeriod(periodSel.orders).filter(o => {
    const num = gv(o,"Номер замовлення");
    const stOk = statusVisible(num);
    const payOk = ordersPayFilter === "all" ||
      (ordersPayFilter === "paid" ? isOrderPaid(num) : !isOrderPaid(num));
    const qOk = !q ||
      gv(o,"Ім'я клієнта").toLowerCase().includes(q) ||
      num.toLowerCase().includes(q) ||
      gv(o,"Телефон").includes(q);
    return stOk && payOk && qOk;
  }).reverse();

  if (!filtered.length) {
    box.innerHTML = "<div class='orders-empty'>Немає замовлень</div>";
    return;
  }

  const rowHTML = (o) => {
    const num = gv(o,"Номер замовлення");
    const warn = deadlineWarn(o);
    const term = gv(o,"Термін") || "—";
    const imp = isImportant(num);
    const flagSvg = "<svg viewBox='0 0 24 24' fill='" + (imp?"currentColor":"none") + "' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 21V4h13l-2 4 2 4H4'/></svg>";
    const master = orderMaster(num);
    const itemsCnt = orderItemCount(num);
    const total = orderTotal(num);
    const paid = isOrderPaid(num);
    const st0 = getStatus(num);
    let needsAttn = total > 0 && !paid;
    if (!needsAttn && (st0 === "ready" || st0 === "issued")) {
      const orderItems = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
      const allNotified = orderItems.length > 0 && orderItems.every(i => gv(i,"Сповіщено"));
      if (!allNotified) needsAttn = true;
    }

function importantSet() {
  try { return new Set(JSON.parse(localStorage.getItem("rw_important") || "[]")); } catch(e) { return new Set(); }
}
function isImportant(num) { return importantSet().has(num); }
function toggleImportant(num, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const s = importantSet();
  if (s.has(num)) s.delete(num); else s.add(num);
  try { localStorage.setItem("rw_important", JSON.stringify([...s])); } catch(e) {}
  renderOrdersList();
}
let _lpSuppressClick = false;
function bindOrderLongPress() {
  document.querySelectorAll("#orders-scroll .order-card").forEach(el => {
    const num = el.getAttribute("data-num");
    let timer = null;
    el.addEventListener("touchstart", () => {
      timer = setTimeout(() => {
        timer = null; _lpSuppressClick = true;
        toggleImportant(num);
        if (navigator.vibrate) navigator.vibrate(18);
      }, 500);
    }, { passive: true });
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchmove", cancel);
    el.addEventListener("click", e => {
      if (_lpSuppressClick) { e.stopImmediatePropagation(); e.preventDefault(); _lpSuppressClick = false; }
    }, true);
  });

const PERIODS = [["week","Тиждень"],["month","Місяць"],["year","Рік"],["all","Весь час"]];
function periodStart(key) {
  const now = new Date();
  if (key === "week") { const d = new Date(now); d.setDate(d.getDate()-7); return d; }
  if (key === "month") { const d = new Date(now); d.setMonth(d.getMonth()-1); return d; }
  if (key === "year") { const d = new Date(now); d.setFullYear(d.getFullYear()-1); return d; }
  return null;
}
function orderDate(o) {
  const s = gv(o,"Дата створення");
  const m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (!m) return null;
  return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
}
const DELETED_MARKER = "[ВИДАЛЕНО] ";
function isOrderDeleted(o) { return gv(o,"Примітка").indexOf(DELETED_MARKER) === 0; }
function orderNoteClean(o) {
  const n = gv(o,"Примітка");
  return isOrderDeleted(o) ? n.slice(DELETED_MARKER.length) : n;
}
function ordersInPeriod(key) {
  const from = periodStart(key);
  const base = ORDERS.filter(o => !isOrderDeleted(o));
  if (!from) return base;
  return base.filter(o => { const d = orderDate(o); return d && d >= from; });
}
function tailorInPeriod(key) {
  const from = periodStart(key);
  const base = TAILOR.filter(t => gv(t,"Примітка").indexOf("[ВИДАЛЕНО] ") !== 0);
  if (!from) return base;
  return base.filter(t => {
    const s = gv(t,"Дата створення");
    const m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    if (!m) return false;
    const d = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
    return d >= from;
  });
}

function orderTotal(num) {
  return ITEMS.filter(i => gv(i,"Номер замовлення") === num)
    .reduce((s,it) => s + extractAmt(gv(it,"Сума")), 0);

/* ═══════════════ ФРАЗА ДНЯ ═══════════════
   Спільна для всього застосунку (не персональна), зберігається в localStorage —
   поки CRM працює на одному пристрої. Якщо колись з'явиться кілька пристроїв
   одночасно — це місце, де знадобиться перенести стан на backend. */
const QUOTES_STORAGE_KEY = "rewise_quotes_state";

function qTodayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function qLoadState() {
  try { const raw = localStorage.getItem(QUOTES_STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return null;
}
function qSaveState(st) {
  try { localStorage.setItem(QUOTES_STORAGE_KEY, JSON.stringify(st)); } catch(e) {}
}
function qInitState() {
  return { date: null, currentId: null, reaction: null, approved: [], pending: QUOTES.map(q => q.id), rejected: [] };
}
/* Гарантує, що стан відповідає сьогоднішній даті — при зміні дня прокручує чергу. */
function qEnsureToday() {
  let st = qLoadState();
  if (!st) st = qInitState();

  // Синхронізація з бібліотекою: прибрати видалені id, додати нові фрази в pending
  const knownIds = new Set(QUOTES.map(q => q.id));
  st.pending = st.pending.filter(id => knownIds.has(id));
  st.approved = st.approved.filter(id => knownIds.has(id));
  st.rejected = st.rejected.filter(id => knownIds.has(id));
  const used = new Set([...st.pending, ...st.approved, ...st.rejected]);
  QUOTES.forEach(q => { if (!used.has(q.id)) st.pending.push(q.id); });

  const today = qTodayStr();
  if (st.date !== today) {
    if (st.currentId != null) {
      const idx = st.pending.indexOf(st.currentId);
      if (st.reaction === "approved") {
        if (idx !== -1) st.pending.splice(idx, 1);
        if (!st.approved.includes(st.currentId)) st.approved.push(st.currentId);
      } else if (st.reaction === "rejected") {
        if (idx !== -1) st.pending.splice(idx, 1);
        if (!st.rejected.includes(st.currentId)) st.rejected.push(st.currentId);
      } else if (idx !== -1) {
        st.pending.splice(idx, 1); st.pending.push(st.currentId);
      }
    }
    if (!st.pending.length) { st.pending = st.approved.length ? st.approved.slice() : QUOTES.map(q => q.id); st.approved = []; }
    st.currentId = st.pending[0];
    st.reaction = null;
    st.date = today;
    qSaveState(st);
  }
  return st;
}
function qReact(type) {
  const st = qEnsureToday();
  st.reaction = (st.reaction === type) ? null : type;
  qSaveState(st);
  renderers.todayplan();
}
function planQuoteCardHTML() {
  const st = qEnsureToday();
  const quote = QUOTES.find(q => q.id === st.currentId);
  if (!quote) return "";
  return "<div class='plan-side-card q-card'>" +
    "<div class='q-text'>«" + quote.text + "»</div>" +
    "<div class='q-attrib'>— REWISE STUDIO</div>" +
    "<div class='q-actions'>" +
      "<span class='q-act" + (st.reaction==="approved" ? " active" : "") + "' onclick=\"qReact('approved')\">" + (st.reaction==="approved" ? "♥" : "♡") + "</span>" +
      "<span class='q-act" + (st.reaction==="rejected" ? " active" : "") + "' onclick=\"qReact('rejected')\">×</span>" +
    "</div>" +
  "</div>";
}

    let action = "<span class='plan-svc-done'>✓ Готово</span>";
    if (status === "🆕 Новий") action = "<button class='plan-svc-btn' onclick=\"svcAction('" + svcNum + "','work')\">Взяти в роботу</button>";
    else if (status === "⚙️ В роботі") action = "<button class='plan-svc-btn ghost' onclick=\"svcAction('" + svcNum + "','ready')\">Готово</button>";
    return "<div class='plan-svc-line'><span class='plan-svc-name'>" + gv(s,"Назва") + "</span>" + masterChip + action + "</div>";
  }).join("");
  return "<div class='plan-accordion'>" + lines + "</div>";
}

function planRowHTML(it, opts) {
  opts = opts || {};
  const itemNum = gv(it,"Номер виробу");
  const orderNum = gv(it,"Номер замовлення");
  const p = planItemProgress(itemNum);
  const expanded = !!planExpanded[itemNum];
  const overdue = planIsOverdue(orderNum);
  const status = gv(it,"Статус");
  const badgeClass = status === "✅ Готово" ? "b-ready" : status === "🆕 Новий" ? "b-new" : overdue ? "b-late" : "b-work";
  const badgeText = status === "✅ Готово" ? "Готово" : status === "🆕 Новий" ? "Новий" : overdue ? "Прострочено" : "В роботі";
  const termStr = planOrderTermStr(orderNum);
  const termSuffix = (planViewMode === "week" && termStr) ? " · термін " + termStr : "";

  const right = opts.issueBtn
    ? "<button class='plan-issue-btn' onclick=\"issueWholeOrder('" + orderNum + "')\">Видати</button>"
    : opts.bell
    ? "<div class='plan-bell' onclick=\"toggleNotified('" + itemNum + "',0)\">🔔</div>"
    : "<div class='plan-row-arrow" + (expanded ? " up" : "") + "'>⌄</div>";

  const clickAttr = opts.issueBtn || opts.bell ? "" : " onclick=\"planToggleExpand('" + itemNum + "')\"";

  return "<div class='plan-row'" + clickAttr + " style='cursor:" + (opts.issueBtn || opts.bell ? "default" : "pointer") + "'>" +
      "<div class='plan-row-num'>" + orderNum + "</div>" +
      "<div class='plan-row-main'><div class='plan-row-name'>" + gv(it,"Бренд") + "</div>" +
        "<div class='plan-row-meta'>" + gv(it,"Тип") + " · " + p.done + "/" + p.total + " операції" + termSuffix + "</div></div>" +
      "<div class='plan-badge " + badgeClass + "'>" + badgeText + "</div>" +
      right +
    "</div>" +
    (!opts.issueBtn && !opts.bell && expanded ? planAccordionHTML(itemNum) : "");
}

function planSectionHTML(key, title, items, opts) {
  const collapsedDefault = items.length === 0;
  const collapsed = (key in planCollapsed) ? planCollapsed[key] : collapsedDefault;
  const rows = collapsed ? "" : items.map(it => planRowHTML(it, opts)).join("");
  return "<div class='plan-card'>" +
    "<div class='plan-card-head' onclick=\"planToggleSection('" + key + "')\">" +
      "<div class='plan-card-head-left'><div class='plan-card-title'>" + title + "</div><div class='plan-card-count'>" + items.length + "</div></div>" +
      "<div class='plan-chev" + (collapsed ? "" : " up") + "'>⌄</div>" +
    "</div>" +
    (collapsed ? "" : "<div>" + (items.length ? rows : "<div class='plan-empty'>Тут порожньо</div>") + "</div>") +
  "</div>";
}

function planCalendarHTML() {
  const y = planCalMonth.getFullYear(), m = planCalMonth.getMonth();
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // понеділок = 0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const monthNames = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];

  const dueDates = {};
  ORDERS.forEach(o => {
    if (isOrderDeleted(o)) return;
    const num = gv(o,"Номер замовлення");
    const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
    if (its.every(i => gv(i,"Статус") === "📦 Виданий")) return;
    const d = parseDeadline(gv(o,"Термін"));
    if (d) dueDates[fmtDateUA(d)] = (dueDates[fmtDateUA(d)]||0) + 1;
  });

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += "<div class='plan-cal-day muted'></div>";
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const dateStr = fmtDateUA(date);
    const isToday = date.getTime() === today.getTime();
    const isSel = planDateFilter === dateStr;
    const hasDue = !!dueDates[dateStr];
    cells += "<div class='plan-cal-day" + (isToday?" today":"") + (isSel && !isToday ? " selected":"") + "' onclick=\"planCalDayClick('" + dateStr + "')\">" + d + (hasDue ? "<span class='dot'></span>" : "") + "</div>";
  }

  return "<div class='plan-side-card'>" +
    "<div class='plan-cal-head'>" + monthNames[m] + " " + y +
      "<div class='plan-cal-nav'><span onclick='planCalPrevMonth()'>‹</span><span onclick='planCalNextMonth()'>›</span></div></div>" +
    "<div class='plan-cal-grid'>" +
      "<div class='plan-cal-dow'>Пн</div><div class='plan-cal-dow'>Вт</div><div class='plan-cal-dow'>Ср</div><div class='plan-cal-dow'>Чт</div><div class='plan-cal-dow'>Пт</div><div class='plan-cal-dow'>Сб</div><div class='plan-cal-dow'>Нд</div>" +
      cells +
    "</div>" +
    (planDateFilter ? "<div class='plan-cal-filter-note'>Фільтр: " + planDateFilter + " <span onclick='planCalDayClick(\"" + planDateFilter + "\")'>× очистити</span></div>" : "") +
  "</div>";
}

let myWorksShowAll = false;
function setMyWorksFilter(v) { myWorksShowAll = v; renderers.myworks(); }
renderers.myworks = function() {
  const page = document.getElementById("page-myworks");
  const mine = activeServices().filter(s => isMineAssignment(gv(s,"Призначено")));
  const list = mine.filter(s => myWorksShowAll || gv(s,"Статус") !== "✅ Готово");

  list.sort((a,b) => {
    const oa = ORDERS.find(o => gv(o,"Номер замовлення") === gv(a,"Номер замовлення"));
    const ob = ORDERS.find(o => gv(o,"Номер замовлення") === gv(b,"Номер замовлення"));
    const da = oa ? parseDeadline(gv(oa,"Термін")) : null;
    const db = ob ? parseDeadline(gv(ob,"Термін")) : null;
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da - db;
  });

  const today = new Date(); today.setHours(0,0,0,0);

  const rows = list.map(s => {
    const svcNum = gv(s,"Номер послуги");
    const itemNum = gv(s,"Номер виробу");
    const orderNum = gv(s,"Номер замовлення");
    const it = ITEMS.find(i => gv(i,"Номер виробу") === itemNum);
    const o = ORDERS.find(x => gv(x,"Номер замовлення") === orderNum);
    const iname = it ? [gv(it,"Тип"), gv(it,"Бренд")].filter(Boolean).join(" · ") || "Виріб" : "Виріб";
    const price = gv(s,"Ціна");
    const status = gv(s,"Статус") || "🆕 Новий";
    const term = o ? gv(o,"Термін") : "";
    const termDate = term ? parseDeadline(term) : null;
    const late = termDate && termDate < today;
    const dueHTML = term
      ? "<span class='mw-due" + (late ? " late" : "") + "'>Термін " + term + (late ? " (протерміновано)" : "") + "</span>"
      : "";

    let actionHTML = "";
    if (status === "🆕 Новий") actionHTML = "<button class='mw-btn' onclick=\"svcAction('" + svcNum + "','work')\">Взяти в роботу</button>";
    else if (status === "⚙️ В роботі") actionHTML = "<button class='mw-btn ghost' onclick=\"svcAction('" + svcNum + "','ready')\">Готово</button>";

    return "<div class='mw-row" + (late ? " overdue" : "") + "'>" +
      "<div class='mw-top'>" +
        "<div class='mw-name'>" + gv(s,"Назва") + "</div>" +
        (price ? "<div class='mw-price'>" + parseInt(price).toLocaleString("uk-UA") + " ₴</div>" : "") +
      "</div>" +
      "<div class='mw-meta'><span class='mw-num'>" + orderNum + "</span> · " + iname + (dueHTML ? " · " + dueHTML : "") + "</div>" +
      "<div class='mw-foot'>" +
        "<span class='mw-status'>" + status + "</span>" +
        actionHTML +
      "</div>" +
    "</div>";
  }).join("");

  page.innerHTML =
    groupSwitcher("planning") +
    "<div class='page-header'><div class='page-title'>Мої роботи</div></div>" +
    "<div class='mw-toggle-row'>" +
      "<div class='mw-seg'>" +
        "<span class='mw-seg-opt" + (!myWorksShowAll?" active":"") + "' onclick='setMyWorksFilter(false)'>Активні</span>" +
        "<span class='mw-seg-opt" + (myWorksShowAll?" active":"") + "' onclick='setMyWorksFilter(true)'>Усі</span>" +
      "</div>" +
    "</div>" +
    (list.length
      ? "<div class='mw-list'>" + rows + "</div>"
      : "<div class='orders-empty'>Тут порожньо</div>");
};

async function assignService(svcNum, masterName) {
  const sv = SERVICES.find(s => gv(s,"Номер послуги") === svcNum);
  if (!sv) return;
  if (gv(sv,"Призначено") && !isAdmin()) return; // переназначити може лише адмін
  sv["Призначено"] = masterName;
  renderers.assign();
  try {
    await fetch(API_URL.replace("/order","/service/assign"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ svc_num: svcNum, assigned: masterName })
    });
  } catch(e) { console.error("service assign failed", e); }
}
const barsExpanded = {};
function barsHTML(data, unit, panelId) {
  const max = Math.max(1, ...data.map(d => d[1]));
  const total = data.reduce((s,d) => s + d[1], 0) || 1;
  const expanded = panelId ? !!barsExpanded[panelId] : true;
  const limit = expanded ? 15 : 5;
  const shown = data.slice(0, limit);
  const rows = shown.map(d => {
    const pct = Math.round(d[1] / total * 100);
    const w = Math.round(d[1] / max * 100);
    const valStr = unit === "₴" ? d[1].toLocaleString("uk-UA") + " ₴" : d[1];
    return "<div class='bar-item'>" +
      "<div class='bar-head'><span class='bar-name'>" + d[0] + "</span>" +
      "<span class='bar-meta'>" + pct + "% · " + valStr + "</span></div>" +
      "<div class='bar-track'><div class='bar-fill' style='width:" + w + "%'></div></div>" +
    "</div>";
  }).join("");
  const canToggle = panelId && data.length > 5;
  const toggleBtn = canToggle ?
    "<button class='bars-toggle' onclick=\"toggleBarsExpand('" + panelId + "')\">" +
      (expanded ? "Згорнути" : "Показати ще (" + Math.min(data.length, 15) + ")") +
    "</button>" : "";
  return rows + toggleBtn;
}
function toggleBarsExpand(panelId) {
  barsExpanded[panelId] = !barsExpanded[panelId];
  if (renderers[currentPage]) renderers[currentPage]();
}

renderers.finance = function() {
  const page = document.getElementById("page-finance");
  const orders = ordersInPeriod(periodSel.finance);

  let revenue = 0, prepaySum = 0, settleSum = 0;
  const byMethod = { "Готівка": 0, "Картка": 0, "ФОП": 0 };
  orders.forEach(o => {
    const num = gv(o,"Номер замовлення");
    revenue += orderTotal(num);
    const pAmt = extractAmt(gv(o,"Оплата"));
    const pM = gv(o,"Спосіб передоплати");
    if (isPrepayStr(gv(o,"Оплата")) && pAmt) { prepaySum += pAmt; if (byMethod[pM] !== undefined) byMethod[pM] += pAmt; }
    const sAmt = extractAmt(gv(o,"Сума доплати"));
    const sM = gv(o,"Спосіб доплати");
    if (sAmt) { settleSum += sAmt; if (byMethod[sM] !== undefined) byMethod[sM] += sAmt; }
  });
  const avg = orders.length ? Math.round(revenue / orders.length) : 0;
  const collected = prepaySum + settleSum;

  // Індпошив за той самий період
  const tailorList = tailorInPeriod(periodSel.finance);
  let tailorRevenue = 0;
  tailorList.forEach(t => {
    tailorRevenue += extractAmt(gv(t,"Вартість"));
    const pAmt = extractAmt(gv(t,"Оплата"));
    const pM = gv(t,"Спосіб передоплати");
    if (isPrepayStr(gv(t,"Оплата")) && pAmt && byMethod[pM] !== undefined) byMethod[pM] += pAmt;
    const sAmt = extractAmt(gv(t,"Сума доплати"));
    const sM = gv(t,"Спосіб доплати");
    if (sAmt && byMethod[sM] !== undefined) byMethod[sM] += sAmt;
  });
  const totalRevenue = revenue + tailorRevenue;
  const totalCount = orders.length + tailorList.length;
  const totalAvg = totalCount ? Math.round(totalRevenue / totalCount) : 0;

  page.innerHTML =
    groupSwitcher("analytics") +
    "<div class='page-header'><div class='page-title'>Фінанси</div></div>" +
    "<div class='tab-scroll'>" +
      periodTabsHTML("finance") +
      "<div class='stat-cards'>" +
        statCard("Загальний обіг", totalRevenue.toLocaleString("uk-UA") + " ₴", true) +
        statCard("Середній чек", totalAvg.toLocaleString("uk-UA") + " ₴") +
        statCard("Отримано коштів", collected.toLocaleString("uk-UA") + " ₴") +
        statCard("Замовлень", totalCount) +
      "</div>" +
      "<div class='stat-panel'><div class='stat-panel-label'>Обіг за напрямками</div>" +
        "<div class='pay-split'>" +
          paySplit("Ремонт (" + orders.length + ")", revenue) +
          paySplit("Виготовлення (" + tailorList.length + ")", tailorRevenue) +
        "</div>" +
      "</div>" +
      "<div class='stat-panel'><div class='stat-panel-label'>Надходження за способом оплати</div>" +
        "<div class='pay-split'>" +
          paySplit("Готівка", byMethod["Готівка"]) +
          paySplit("Картка", byMethod["Картка"]) +
          paySplit("ФОП", byMethod["ФОП"]) +
        "</div>" +
      "</div>" +
    "</div>";
};
function statCard(label, value, accent) {
  return "<div class='stat-card'><div class='sc-label'>" + label + "</div><div class='sc-value" + (accent?" accent":"") + "'>" + value + "</div></div>";
}
function paySplit(label, val) {
  return "<div class='pay-split-item'><div class='ps-label'>" + label + "</div><div class='ps-value'>" + (val||0).toLocaleString("uk-UA") + " ₴</div></div>";

renderers.stats = function() {
  const page = document.getElementById("page-stats");
  const orders = ordersInPeriod(periodSel.stats);
  const orderNums = new Set(orders.map(o => gv(o,"Номер замовлення")));
  const tailorList = tailorInPeriod(periodSel.stats);

  // Клієнти — ремонт + пошив
  const phones = {};
  orders.forEach(o => { const p = gv(o,"Телефон"); if (p) phones[p] = (phones[p]||0)+1; });
  tailorList.forEach(t => { const p = gv(t,"Телефон"); if (p) phones[p] = (phones[p]||0)+1; });
  const totalClients = Object.keys(phones).length;
  const repeat = Object.values(phones).filter(c => c > 1).length;

  // Топ послуг
  const svcCount = {};
  ITEMS.filter(i => orderNums.has(gv(i,"Номер замовлення"))).forEach(it => {
    (gv(it,"Послуги")||"").split(",").forEach(s => {
      const k = s.trim().split("—")[0].trim();
      if (k) svcCount[k] = (svcCount[k]||0)+1;
    });
  });
  const topSvc = Object.entries(svcCount).sort((a,b)=>b[1]-a[1]).map(e=>[e[0],e[1]]);

  // По приймальниках (оборот)
  const byMgr = {};
  orders.forEach(o => { const m = gv(o,"Приймальник")||"—"; byMgr[m] = (byMgr[m]||0) + orderTotal(gv(o,"Номер замовлення")); });
  const mgrData = Object.entries(byMgr).sort((a,b)=>b[1]-a[1]).map(e=>[e[0],e[1]]);

  // Топ клієнтів (за сумою або кількістю — перемикач)
  const clientAgg = {};
  orders.forEach(o => {
    const phone = gv(o,"Телефон"); if (!phone) return;
    const name = gv(o,"Ім'я клієнта") || phone;
    if (!clientAgg[phone]) clientAgg[phone] = { name, sum: 0, count: 0 };
    clientAgg[phone].sum += orderTotal(gv(o,"Номер замовлення"));
    clientAgg[phone].count += 1;
  });
  tailorList.forEach(t => {
    const phone = gv(t,"Телефон"); if (!phone) return;
    const name = gv(t,"Ім'я клієнта") || phone;
    if (!clientAgg[phone]) clientAgg[phone] = { name, sum: 0, count: 0 };
    clientAgg[phone].sum += extractAmt(gv(t,"Вартість"));
    clientAgg[phone].count += 1;
  });
  const clientList = Object.values(clientAgg);
  const topClientsBySum = [...clientList].sort((a,b)=>b.sum-a.sum).map(c=>[c.name, c.sum]);
  const topClientsByCount = [...clientList].sort((a,b)=>b.count-a.count).map(c=>[c.name, c.count]);
  window._topClientsBySum = topClientsBySum;
  window._topClientsByCount = topClientsByCount;

  page.innerHTML =
    groupSwitcher("analytics") +
    "<div class='page-header'><div class='page-title'>Статистика</div></div>" +

// Вкладка задач винесено у js/tasks.js (підключено наприкінці, після основного коду)

/* ═══════════════ РЕДАГУВАННЯ ЗАМОВЛЕННЯ ═══════════════ */
let editState = null;

function openEditOrder(num) {
  if (!isAdmin()) { toast("Редагування доступне лише адміністратору"); return; }
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  // Розбираємо послуги виробів у редаговану структуру
  editState = {
    num: num,
    client: gv(o,"Ім'я клієнта"),
    phone: gv(o,"Телефон"),
    messenger: gv(o,"Месенджер"),
    payment: isPrepayStr(gv(o,"Оплата")) ? "Передплата" : (gv(o,"Оплata") || gv(o,"Оплата") || ""),
    deadline: gv(o,"Термін"),
    items: its.map((it, idx) => ({
      type: gv(it,"Тип"),
      brand: gv(it,"Бренд"),
      servicesRaw: gv(it,"Послуги"),
      total: extractAmt(gv(it,"Сума"))
    }))
  };
  renderEditForm();
}

function renderEditForm() {
  const body = document.getElementById("odm-body");
  const e = editState;
  const itemsHTML = e.items.map((it, idx) =>
    "<div class='edit-item'>" +
      "<div class='edit-item-head'><span class='itemcard-num'>№" + (idx+1) + "</span>" +
        "<button class='itemcard-rm' onclick='editRemoveItem(" + idx + ")'>×</button></div>" +
      "<div class='ic-row'><div class='ic-field'><label>ТИП</label><input class='ic-mini' value=\"" + it.type.replace(/"/g,"&quot;") + "\" oninput='editState.items[" + idx + "].type=this.value'></div>" +
      "<div class='ic-field'><label>БРЕНД</label><input class='ic-mini' value=\"" + it.brand.replace(/"/g,"&quot;") + "\" oninput='editState.items[" + idx + "].brand=this.value'></div></div>" +
      "<div class='ic-row'><div class='ic-field'><label>ПОСЛУГИ</label><input class='ic-mini' value=\"" + it.servicesRaw.replace(/"/g,"&quot;") + "\" oninput='editState.items[" + idx + "].servicesRaw=this.value'></div>" +
      "<div class='ic-field' style='max-width:110px'><label>СУМА ₴</label><input class='ic-mini' type='number' value='" + it.total + "' oninput='editState.items[" + idx + "].total=parseInt(this.value)||0'></div></div>" +
    "</div>"
  ).join("");

  const msgPick = ["telegram","whatsapp","viber"].map(m => {
    const active = e.messenger === m;
    const style = active ? " style='background:" + MSG_COLORS[m] + "'" : "";
    return "<button class='cr-msg-btn" + (active?" active":"") + "'" + style + " onclick=\"editSetMsg('" + m + "')\"><span class='msg-ico'" + (active?" style='color:#fff'":"") + ">" + MSG_ICONS[m] + "</span>" + MSG_LABELS[m] + "</button>";
  }).join("");

  body.innerHTML =
    "<div class='detail-top'><span class='detail-title'>Редагування " + e.num + "</span></div>" +
    "<div class='edit-form'>" +
      "<div class='cr-block-label first'>Клієнт</div>" +
      "<input class='cr-input' id='edit-client' value=\"" + e.client.replace(/"/g,"&quot;") + "\" oninput='editState.client=this.value'>" +
      "<input class='cr-input' id='edit-phone' readonly style='cursor:pointer' value=\"" + fmtPhone(e.phone) + "\" onclick='openPhoneKeypad(editState.phone||\"+380 \", function(v){ editState.phone=v; var el=document.getElementById(\"edit-phone\"); if(el) el.value=fmtPhone(v); }, function(v){ editState.phone=v; var el=document.getElementById(\"edit-phone\"); if(el) el.value=fmtPhone(v); }, this)'>" +
      "<div class='cr-msg-pick' id='edit-msg'>" + msgPick + "</div>" +
      "<div class='cr-block-label'>Термін</div>" +
      "<input class='cr-input' id='edit-deadline' value=\"" + e.deadline.replace(/"/g,"&quot;") + "\" oninput='editState.deadline=this.value'>" +
      "<div class='cr-block-label'>Вироби та послуги</div>" +
      itemsHTML +
      "<button class='add-item-btn' onclick='editAddItem()'>+ Додати виріб</button>" +

        "<button class='cr-btn' onclick=\"openOrder('" + e.num + "')\" style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:13px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:13px'>Скасувати</button>" +
        "<button class='cr-create-btn' style='flex:2;margin-top:0' onclick='saveEditOrder()'>Зберегти зміни</button>" +

    "</div>";
}

function editSetMsg(m) { editState.messenger = (editState.messenger === m) ? "" : m; renderEditForm(); }
function editRemoveItem(idx) { editState.items.splice(idx,1); renderEditForm(); }
function editAddItem() { editState.items.push({ type:"", brand:"", servicesRaw:"", total:0 }); renderEditForm(); }

async function saveEditOrder() {
  const e = editState;
  if (!e.client.trim()) { alert("Введіть ім'я клієнта"); return; }
  if (!e.phone.trim()) { alert("Введіть телефон"); return; }
  // Оновлюємо локально
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === e.num);
  if (o) {
    o["Ім'я клієнта"] = e.client; o["Телефон"] = e.phone;
    o["Месенджер"] = e.messenger; o["Термін"] = e.deadline;
  }
  // Оновлюємо вироби локально
  ITEMS = ITEMS.filter(i => gv(i,"Номер замовлення") !== e.num);
  e.items.forEach((it, idx) => {
    ITEMS.push({
      "Номер замовлення": e.num, "Номер виробу": e.num + "-" + (idx+1),
      "Тип": it.type, "Бренд": it.brand, "Послуги": it.servicesRaw,
      "Сума": it.total.toLocaleString("uk-UA") + " ₴", "Статус": "🆕 Новий",
      "Дата прийому":"","Дата в роботі":"","Дата готово":"","Дата видачі":"","Сповіщено":""
    });
  });
  openOrder(e.num);
  // Зберігаємо на сервер
  try {
    await fetch(API_URL.replace("/order","/order/update"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: e.num, client: e.client, phone: e.phone, messenger: e.messenger, deadline: e.deadline })
    });
    await fetch(API_URL.replace("/order","/items/update"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: e.num, items: e.items.map(it => ({ type: it.type, brand: it.brand, services: it.servicesRaw, total: it.total.toLocaleString("uk-UA") + " ₴" })) })
    });
    toast("Зміни збережено");
  } catch(err) { console.error("edit save failed", err); }
}

/* ═══════════════ ВКЛАДКА НАЛАШТУВАННЯ ═══════════════ */
let settingsSection = "params"; // params | price
let priceOpenCat = "";
let priceOpenDept = "";

renderers.settings = function() {

  if (settingsSection === "price") renderPriceEditor();

};
function setSettingsSection(s) { settingsSection = s; renderers.settings(); }

function renderPriceEditor() {
  const box = document.getElementById("settings-body");
  if (!box) return;
  if (!priceLoaded) { box.innerHTML = "<div class='orders-loading'>Завантаження прайсу...</div>"; return; }

  const cats = Object.keys(PRICE);
  if (!cats.length) { box.innerHTML = "<div class='orders-empty'>Прайс порожній</div>"; return; }
  if (!priceOpenCat || !PRICE[priceOpenCat]) priceOpenCat = cats[0];

  const catTabs = "<div class='cr-pills' style='margin-bottom:10px'>" + cats.map(k =>
    "<button class='cr-pill" + (priceOpenCat===k?" active":"") + "' onclick=\"setPriceCat('" + k + "')\">" + PRICE[k].label + "</button>"
  ).join("") + "</div>";

  const cat = PRICE[priceOpenCat];
  const allDepts = Object.keys(cat.departments);
  if (priceOpenDept && allDepts.indexOf(priceOpenDept) === -1) priceOpenDept = "";

  const deptTabs = "<div class='cr-pills' style='margin-bottom:16px'>" +
    "<button class='cr-pill" + (!priceOpenDept?" active":"") + "' onclick=\"setPriceDept('')\">Усі</button>" +
    allDepts.map(d =>
      "<button class='cr-pill" + (priceOpenDept===d?" active":"") + "' onclick=\"setPriceDept('" + d.replace(/'/g,"\\'") + "')\">" + d + "</button>"
    ).join("") + "</div>";

  const depts = priceOpenDept ? [priceOpenDept] : allDepts;

  const body = depts.map(dept => {
    const dEsc = dept.replace(/'/g,"\\'");
    const id = hashId(priceOpenCat + dept);

    const rows = cat.departments[dept].map(s => {
      const sName = s.name.replace(/'/g,"\\'");
      const pKey = "p|" + priceOpenCat + "|" + dept + "|" + s.name;
      const aKey = "a|" + priceOpenCat + "|" + dept + "|" + s.name;
      const tKey = "t|" + priceOpenCat + "|" + dept + "|" + s.name;
      const nKey = "m|" + priceOpenCat + "|" + dept + "|" + s.name;
      const fKey = "f|" + priceOpenCat + "|" + dept + "|" + s.name;
      const pend = pendingPrice[pKey];
      const aPend = pendingPrice[aKey];
      const tPend = pendingPrice[tKey];
      const nPend = pendingPrice[nKey];
      const fPend = pendingPrice[fKey];
      const shownActive = aPend ? aPend.newValue : (s.active !== false);
      const shownPrice = pend ? pend.newValue : s.price;
      const shownTerm = tPend ? tPend.newValue : (s.term || "");
      const shownName = nPend ? nPend.newValue : s.name;
      const shownFrom = fPend ? fPend.newValue : !!s.from;

      return "<div class='price-row" + (shownActive ? "" : " hidden-row") + (pend || aPend || tPend || nPend || fPend ? " pending" : "") + "'>" +
        "<div class='price-name-cell'>" +
          "<input class='price-input price-name-input' type='text' value=\"" + shownName.replace(/"/g,"&quot;") + "\" " +
            "onchange=\"stageName('" + priceOpenCat + "','" + dEsc + "','" + sName + "',this.value)\">" +
          (shownActive ? "" : " <span class='price-hidden-tag'>приховано</span>") +
          (pend ? " <span class='price-was'>було " + s.price + " ₴</span>" : "") +
          (nPend ? " <span class='price-was'>було «" + s.name + "»</span>" : "") +
        "</div>" +
        "<span class='price-unit'>" + (s.unit || "") + "</span>" +
        "<input class='price-input' type='number' value='" + shownPrice + "' " +
          "onchange=\"stagePrice('" + priceOpenCat + "','" + dEsc + "','" + sName + "',this.value)\">" +
        "<input class='price-input' type='number' value='" + shownTerm + "' placeholder='дн' title='Термін, днів' " +
          "onchange=\"stageTerm('" + priceOpenCat + "','" + dEsc + "','" + sName + "',this.value)\">" +
        "<button class='price-btn price-from-btn" + (shownFrom?" on":"") + "' title='" + (shownFrom?"Зняти позначку «від»":"Позначити ціну як «від»") + "' " +
          "onclick=\"stageFrom('" + priceOpenCat + "','" + dEsc + "','" + sName + "'," + (shownFrom?"false":"true") + ")\">від</button>" +
        "<button class='price-btn' title='" + (shownActive?"Приховати":"Показати") + "' " +
          "onclick=\"stageActive('" + priceOpenCat + "','" + dEsc + "','" + sName + "'," + (shownActive?"false":"true") + ")\">" +
          (shownActive ? "🚫" : "👁") + "</button>" +
      "</div>";
    }).join("");

    // Нові послуги, які ще не підтверджені
    const newRows = Object.keys(pendingPrice).filter(k => {
      const ch = pendingPrice[k];
      return ch.type === "add" && ch.cat === priceOpenCat && ch.dept === dept;
    }).map(k => {
      const ch = pendingPrice[k];

    }).join("");

    return "<div class='stat-panel' style='margin-bottom:12px'>" +

        "<input class='ic-mini' style='max-width:100px' id='pa-unit-" + id + "' placeholder='Одиниця'>" +

        "<input class='ic-mini' style='max-width:72px' type='number' id='pa-term-" + id + "' placeholder='дн'>" +
        "<label class='price-add-from'><input type='checkbox' id='pa-from-" + id + "'> від</label>" +
        "<button class='ic-manual-add' onclick=\"stageAdd('" + priceOpenCat + "','" + dEsc + "')\">+</button>" +
      "</div>" +
    "</div>";
  }).join("");

  const n = Object.keys(pendingPrice).length;
  const bar = n ?
    "<div class='pending-bar'>" +
      "<span class='pending-count'>Незбережених змін: " + n + "</span>" +
      "<button class='pending-cancel' onclick='discardPending()'>Скасувати</button>" +

    "</div>" : "";

  box.innerHTML = "<div class='price-editor-wrap'>" + catTabs + deptTabs + body +

    bar +
  "</div>";
}
function hashId(str) { let h = 0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 100000; return h; }
function setPriceCat(k) { priceOpenCat = k; priceOpenDept = ""; renderPriceEditor(); }
function setPriceDept(d) { priceOpenDept = d; renderPriceEditor(); }

function findPriceSvc(cat, dept, name) {
  const list = (PRICE[cat] && PRICE[cat].departments[dept]) || [];
  return list.find(s => s.name === name);
}

/* ─── Накопичення змін (без збереження) ─── */
let pendingPrice = {};

function stagePrice(cat, dept, name, value) {
  const v = parseInt(value);
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  if (isNaN(v) || v < 0) { toast("Некоректна ціна"); renderPriceEditor(); return; }
  const key = "p|" + cat + "|" + dept + "|" + name;
  if (v === s.price) delete pendingPrice[key];
  else pendingPrice[key] = { type: "price", cat, dept, name, oldValue: s.price, newValue: v };
  renderPriceEditor();
}

function stageActive(cat, dept, name, makeActive) {
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  const key = "a|" + cat + "|" + dept + "|" + name;
  const current = s.active !== false;
  if (makeActive === current) delete pendingPrice[key];
  else pendingPrice[key] = { type: "active", cat, dept, name, oldValue: current, newValue: makeActive };
  renderPriceEditor();
}

function stageTerm(cat, dept, name, value) {
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  const raw = String(value).trim();
  const key = "t|" + cat + "|" + dept + "|" + name;
  const cur = String(s.term || "").trim();
  if (raw !== "" && (isNaN(parseInt(raw)) || parseInt(raw) < 0)) { toast("Термін — число днів"); renderPriceEditor(); return; }
  const norm = raw === "" ? "" : String(parseInt(raw));
  if (norm === cur) delete pendingPrice[key];
  else pendingPrice[key] = { type: "term", cat, dept, name, oldValue: cur, newValue: norm };
  renderPriceEditor();
}

function stageName(cat, dept, name, value) {
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  const v = String(value).trim();
  const key = "m|" + cat + "|" + dept + "|" + name;
  if (!v) { toast("Назва не може бути порожньою"); renderPriceEditor(); return; }
  if (v === name) { delete pendingPrice[key]; renderPriceEditor(); return; }
  if (v !== name && findPriceSvc(cat, dept, v)) { toast("Послуга з такою назвою вже є"); renderPriceEditor(); return; }
  pendingPrice[key] = { type: "name", cat, dept, name, oldValue: name, newValue: v };
  renderPriceEditor();
}

function stageFrom(cat, dept, name, makeFrom) {
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  const key = "f|" + cat + "|" + dept + "|" + name;
  const current = !!s.from;
  if (makeFrom === current) delete pendingPrice[key];
  else pendingPrice[key] = { type: "from", cat, dept, name, oldValue: current, newValue: makeFrom };
  renderPriceEditor();
}

function stageAdd(cat, dept) {
  const id = hashId(cat + dept);
  const nameEl = document.getElementById("pa-name-" + id);
  const unitEl = document.getElementById("pa-unit-" + id);
  const priceEl = document.getElementById("pa-price-" + id);
  const termEl = document.getElementById("pa-term-" + id);
  const fromEl = document.getElementById("pa-from-" + id);
  const name = nameEl.value.trim();
  const unit = unitEl.value.trim();
  const price = parseInt(priceEl.value || "0");
  const term = termEl && termEl.value.trim() ? String(parseInt(termEl.value)) : "";
  const from = !!(fromEl && fromEl.checked);
  if (!name) { toast("Вкажіть назву послуги"); return; }
  if (!price) { toast("Вкажіть ціну"); return; }
  if (findPriceSvc(cat, dept, name)) { toast("Така послуга вже є"); return; }
  const key = "n|" + cat + "|" + dept + "|" + name;
  pendingPrice[key] = { type: "add", cat, dept, name, unit, term, from, newValue: price };
  nameEl.value = ""; unitEl.value = ""; priceEl.value = ""; if (termEl) termEl.value = ""; if (fromEl) fromEl.checked = false;
  renderPriceEditor();
}

function cancelPending(key) { delete pendingPrice[key]; renderPriceEditor(); }
function discardPending() {
  if (!confirm("Скасувати всі незбережені зміни?")) return;
  pendingPrice = {};
  renderPriceEditor();
}

/* ─── Підтвердження паролем ─── */
function openPriceConfirm() {
  const keys = Object.keys(pendingPrice);
  if (!keys.length) return;

  const list = keys.map(k => {

async function confirmDeleteOrder() {
  if (!pendingDeleteOrder) return;
  const err = document.getElementById("delete-order-err");
  const pw = document.getElementById("delete-order-pw").value;
  if (!pw) { err.textContent = "Введіть пароль"; return; }
  let hash;
  try { hash = await sha256(pw); } catch(e) { err.textContent = "Помилка перевірки"; return; }
  if (hash !== ROLE_HASHES.admin) { err.textContent = "Невірний пароль"; return; }

  const btn = document.getElementById("delete-order-btn");
  btn.textContent = "Видалення..."; btn.disabled = true;
  err.textContent = "";

  const num = pendingDeleteOrder;
  try {
    const res = await fetch(API_URL.replace("/order","/order/delete"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: num })
    });
    const r = await res.json();
    if (r.status !== "ok") throw new Error(r.message || "error");
  } catch(e) {
    err.textContent = "Не вдалося видалити. Спробуйте ще раз.";
    btn.textContent = "Видалити"; btn.disabled = false;
    return;
  }

  closeDeleteOrderConfirm();
  backToOrders();
  await loadData();
  renderers[currentPage] && renderers[currentPage]();
  toast("Замовлення " + num + " видалено");
}

function openClientHistory(phone, currentNum) {
  const orders = ORDERS.filter(x => gv(x,"Телефон") === phone && !isOrderDeleted(x));
  const sorted = [...orders].sort((a,b) => {
    const da = orderDate(a), db = orderDate(b);
    if (da && db) return db - da;

    if (db) return 1;
    return 0;

  const rows = sorted.map(o => {
    const num = gv(o,"Номер замовлення");

    const meta = STATUS_META[st];

    const date = gv(o,"Дата створення").split(" ")[0];

async function priceApi(path, payload) {
  try {
    const res = await fetch(API_URL.replace("/order", path), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const r = await res.json();
    return r.status === "ok";
  } catch(e) { return false; }
}

async function applyPendingPrice() {
  const err = document.getElementById("price-confirm-err");
  const pw = document.getElementById("price-confirm-pw").value;
  if (!pw) { err.textContent = "Введіть пароль"; return; }
  let hash;
  try { hash = await sha256(pw); } catch(e) { err.textContent = "Помилка перевірки"; return; }
  if (hash !== ROLE_HASHES.admin) { err.textContent = "Невірний пароль"; return; }

  const btn = document.getElementById("price-confirm-btn");
  btn.textContent = "Збереження..."; btn.disabled = true;
  err.textContent = "";

  const keys = Object.keys(pendingPrice);
  let failed = 0;
  for (const k of keys) {
    const ch = pendingPrice[k];
    let ok = false;
    if (ch.type === "price") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, price: ch.newValue });
      if (ok) { const s = findPriceSvc(ch.cat, ch.dept, ch.name); if (s) s.price = ch.newValue; }
    } else if (ch.type === "active") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, active: ch.newValue });
      if (ok) { const s = findPriceSvc(ch.cat, ch.dept, ch.name); if (s) s.active = ch.newValue; }
    } else if (ch.type === "term") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, term: ch.newValue });
      if (ok) { const s = findPriceSvc(ch.cat, ch.dept, ch.name); if (s) s.term = ch.newValue; }
    } else if (ch.type === "name") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, newName: ch.newValue });
      if (ok) {
        const s = findPriceSvc(ch.cat, ch.dept, ch.name);
        if (s) s.name = ch.newValue;
        // Розповсюджуємо перейменування на інші ще не оброблені зміни цього ж
        // рядка (напр. одночасно позначили «від») — інакше вони шукатимуть
        // рядок за вже застарілою назвою і не знайдуть його.
        keys.forEach(function(otherKey){
          const other = pendingPrice[otherKey];
          if (other && other !== ch && other.cat === ch.cat && other.dept === ch.dept && other.name === ch.name) {
            other.name = ch.newValue;
          }
        });
      }
    } else if (ch.type === "from") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, from: ch.newValue });
      if (ok) { const s = findPriceSvc(ch.cat, ch.dept, ch.name); if (s) s.from = ch.newValue; }
    } else {
      ok = await priceApi("/price/add", { category: ch.cat, department: ch.dept, service: ch.name, unit: ch.unit, price: ch.newValue, term: ch.term || "", from: !!ch.from });
      if (ok) PRICE[ch.cat].departments[ch.dept].push({ name: ch.name, price: ch.newValue, unit: ch.unit, active: true, term: ch.term || "", from: !!ch.from });
    }
    if (ok) delete pendingPrice[k]; else failed++;
  }

  closePriceConfirm();
  renderPriceEditor();
  toast(failed ? ("Збережено з помилками: " + failed) : "Зміни застосовано");
}

async function saveParams() {
  const green  = parseInt(document.getElementById("set-bonus-green").value || "0");
  const yellow = parseInt(document.getElementById("set-bonus-yellow").value || "0");
  const red    = parseInt(document.getElementById("set-bonus-red").value || "0");
  const min = parseInt(document.getElementById("set-bonus-min").value || "0");
  const cap = parseInt(document.getElementById("set-bonus-cap").value || "0");
  for (const v of [green, yellow, red]) {
    if (isNaN(v) || v < 0 || v > 50) { toast("Відсоток має бути від 0 до 50"); return; }
  }
  if (cap < 1 || cap > 100) { toast("Ліміт має бути від 1 до 100"); return; }
  BONUS_PCT_RATING.green = green;
  BONUS_PCT_RATING.yellow = yellow;
  BONUS_PCT_RATING.red = red;
  BONUS_PCT = yellow || BONUS_PCT;
  BONUS_MIN_SPEND = min; BONUS_SPEND_CAP = cap;
  const ok = await priceApi("/settings/update", { items: {
    "Бонус % надійний": green,
    "Бонус % звичайний": yellow,
    "Бонус % уважно": red,
    "Бонус %": yellow,
    "Мінімум списання": min,
    "Ліміт списання %": cap
  }});
  toast(ok ? "Налаштування збережено" : "Не вдалося зберегти");
}
