<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rewise CRM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E1E1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rewise CRM">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Commissioner:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ═══════════════ ТЕМИ — CSS-ЗМІННІ ═══════════════ */
:root {
  /* Бренд (не залежить від теми) */
  --cognac:  #A0845C;
  --cognac-light: rgba(160,132,92,0.12);
  --cognac-border: rgba(160,132,92,0.3);
  --leather: #6B4F3A;
  --brown:   #3A3228;
  --linen:   #F0EBE3;

  /* Статуси */
  --st-new-bg:#E6F1FB; --st-new-fg:#185FA5;
  --st-work-bg:#FAEEDA; --st-work-fg:#854F0B;
  --st-ready-bg:#EAF3DE; --st-ready-fg:#3B6D11;
  --st-issued-bg:#F1EFE8; --st-issued-fg:#5F5E5A;
  --st-postponed-bg:#FCEBEB; --st-postponed-fg:#A32D2D;

  /* Навігація — завжди темна */
  --nav-bg: #181614;
  --nav-border: rgba(160,132,92,0.15);
  --nav-txt: rgba(240,235,227,0.5);
  --nav-txt-active: #fff;
}

/* СВІТЛА тема (за замовчуванням) */
:root, [data-theme="light"] {
  --bg:        #FAF8F6;
  --surface:   #FFFFFF;
  --surface-2: #FFFFFF;
  --txt:       #2A2621;
  --txt-2:     rgba(42,38,33,0.6);
  --txt-3:     rgba(42,38,33,0.4);
  --line:      rgba(58,50,40,0.12);
  --line-soft: rgba(58,50,40,0.08);
  --field-bg:  #FFFFFF;
  --field-border: rgba(58,50,40,0.15);
  --hover:     rgba(160,132,92,0.06);
  --receipt-shadow: 0 8px 28px rgba(58,50,40,0.14);
  --accent-soft: rgba(160,132,92,0.1);
}

/* ТЕМНА тема */
[data-theme="dark"] {
  --bg:        #1E1E1E;
  --surface:   #232020;
  --surface-2: #2a2622;
  --txt:       #F0EBE3;
  --txt-2:     rgba(240,235,227,0.6);
  --txt-3:     rgba(240,235,227,0.4);
  --line:      rgba(160,132,92,0.15);
  --line-soft: rgba(160,132,92,0.08);
  --field-bg:  rgba(240,235,227,0.05);
  --field-border: rgba(160,132,92,0.25);
  --hover:     rgba(160,132,92,0.1);
  --receipt-shadow: 0 8px 28px rgba(0,0,0,0.4);
  --accent-soft: rgba(160,132,92,0.12);
  --st-new-bg:#12324F; --st-new-fg:#9FCBF0;
  --st-work-bg:#3D2E12; --st-work-fg:#F0C066;
  --st-ready-bg:#22381A; --st-ready-fg:#A5D46F;
  --st-issued-bg:#2E2E2A; --st-issued-fg:#B4B2A9;
  --st-postponed-bg:#3D1A1A; --st-postponed-fg:#E88A8A;
}

body {
  background: var(--bg);
  color: var(--txt);
  font-family: 'Commissioner', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  transition: background 0.25s, color 0.25s;
}

/* ═══════════════ НАВІГАЦІЯ ═══════════════ */
.nav {
  width: 84px;
  min-width: 84px;
  background: var(--nav-bg);
  border-right: 1px solid var(--nav-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(22px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom));
  gap: 3px;
  height: 100vh;
  height: 100dvh;
  position: sticky;
  top: 0;
  flex-shrink: 0;
  z-index: 20;
}
.nav-logo {
  font-family: 'Tenor Sans', serif;
  font-size: 15px;
  letter-spacing: 0.1em;
  color: var(--linen);
  margin-bottom: 18px;
}
.nav-item {
  width: 68px;
  padding: 10px 0;
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  letter-spacing: 0.02em;
  cursor: pointer;
  color: var(--nav-txt);
  border: none;
  background: transparent;
  font-family: 'Commissioner', sans-serif;
  transition: background 0.15s, color 0.15s;
  text-align: center;
}
.nav-item svg { width: 19px; height: 19px; stroke-width: 1.6; }
.nav-item:hover { color: rgba(240,235,227,0.8); }
.nav-item.active { background: var(--cognac); color: var(--nav-txt-active); }
.nav-spacer { flex: 1; }
.nav-div { width: 40px; height: 1px; background: var(--nav-border); margin: 7px 0; flex-shrink: 0; }
.nav-clock { text-align: center; margin: 8px 0; flex-shrink: 0; }
.nav-role-static { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--nav-txt); text-align: center; opacity: 0.75; margin-bottom: 8px; flex-shrink: 0; }
.nav-analog { width: 58px; height: 58px; display: block; margin: 0 auto; }
.nav-clock-date { display: none; }

/* Міні-календар — тільки на широкій панелі */
.nav-mini-cal { display: none; width: 148px; padding: 0 4px 10px; flex-shrink: 0; }
.nmc-title { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cognac); text-align: center; margin-bottom: 7px; }
.nmc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.nmc-dow { font-size: 7px; color: rgba(240,235,227,0.35); text-align: center; padding-bottom: 3px; }
.nmc-day { font-size: 8.5px; text-align: center; padding: 3px 0; border-radius: 4px; color: rgba(240,235,227,0.55); }
.nmc-day.today { background: var(--cognac); color: #fff; font-weight: 500; }
.nmc-day.has-ev { box-shadow: inset 0 -2px 0 rgba(160,132,92,0.6); }


.nav-theme {
  width: 44px; height: 44px;
  border-radius: 10px;
  border: 1px solid var(--nav-border);
  background: transparent;
  color: var(--nav-txt);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.15s, border-color 0.15s;
}
.nav-theme svg { width: 18px; height: 18px; stroke-width: 1.6; }
.nav-theme:hover { color: var(--linen); border-color: var(--cognac-border); }

/* ═══════════════ КОНТЕНТ ═══════════════ */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
}
.page { display: none; flex-direction: column; flex: 1; }
.page.active { display: flex; }

.page-header {
  padding: 22px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.grp-switch { display: flex; gap: 8px; padding: 16px 28px 0; }
.grp-tab { padding: 8px 16px; border-radius: 18px; border: 1px solid var(--field-border); background: transparent; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.grp-tab:hover { border-color: var(--cognac); }
.grp-tab.active { background: var(--cognac); border-color: var(--cognac); color: #fff; }
.page-title { font-family: 'Tenor Sans', serif; font-size: 20px; color: var(--txt); }

.btn-primary {
  background: var(--cognac);
  border: none;
  border-radius: 7px;
  color: #fff;
  font-family: 'Commissioner', sans-serif;
  font-size: 12px;
  font-weight: 400;
  padding: 10px 17px;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--leather); }
.btn-primary svg { width: 14px; height: 14px; stroke-width: 2; }

/* Заглушка */
.stub {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--txt-3); font-size: 13px; text-align: center;
  padding: 60px 20px; gap: 14px;
}
.stub svg { width: 34px; height: 34px; stroke-width: 1.4; opacity: 0.7; }

/* ═══════════════ ВКЛАДКА СТВОРИТИ (КОШТОРИС) ═══════════════ */
.create-wrap { display: flex; flex: 1; min-height: 0; gap: 18px; }
.create-left { flex: 1; min-width: 0; padding: 6px 0 32px 24px; overflow-y: auto; }
.create-right { width: 340px; flex-shrink: 0; min-width: 0; padding: 6px 24px 32px 0; }
.create-right-sticky { position: sticky; top: 8px; }

.cr-grid { display: flex; flex-direction: column; gap: 10px; max-width: none; }
.cr-box { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
.cr-box-full { grid-column: 1 / -1; }
.cr-mgr-center { justify-content: center; }
.cr-client-row { display: flex; gap: 8px; align-items: flex-start; }

/* ═══ Телефон: форма створення в один стовпчик, нічого не вилазить ═══ */
@media (max-width: 620px) {
  .cr-client-row { flex-direction: column; gap: 10px; }
  .cr-client-row > * { width: 100% !important; flex: none !important; min-width: 0 !important; }
  .cr-msg-pick { width: 100%; }
  .cr-msg-icons { justify-content: flex-start; }
  .cr-payterm { grid-template-columns: 1fr; }
  .cr-input { font-size: 16px; }
  .cr-pill { font-size: 15px; padding: 13px 14px; }
  .cr-bottom3 { grid-template-columns: 1fr; }
  .cr-bottom3 .cr-col + .cr-col { border-left: 1px solid var(--line-soft) !important; padding-left: 16px !important; }
}
.cr-msg-icons { display: flex; gap: 6px; flex-shrink: 0; margin: 0; }
.cr-msg-ico-btn { width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; }
.cr-msg-ico-btn .msg-ico { margin: 0; }
.cr-payterm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
@media (max-width: 620px) { .cr-payterm { grid-template-columns: 1fr; } }
.cr-right-actions { display: flex; gap: 8px; margin-bottom: 12px; justify-content: flex-end; }
.cr-right-actions .cr-head-btn { flex: 0 0 auto; text-align: center; padding: 7px 12px; font-size: 11px; }
.cr-create-under { width: 100%; margin-top: 12px; }
.cr-box .cr-block-label { margin-top: 16px; }
.cr-box .cr-block-label.first { margin-top: 0; }

.cr-block-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cognac); margin: 14px 0 8px; }
.cr-block-label.first { margin-top: 6px; }

.cr-pills { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
.cr-pill { padding: 7px 13px; border-radius: 20px; border: 1px solid var(--field-border); background: transparent; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.cr-pill:hover { border-color: var(--cognac); color: var(--txt); }
.cr-pill.active { background: var(--cognac); color: #fff; border-color: var(--cognac); }
.cr-pill-wide { flex: 1; text-align: center; }

.cr-input { width: 100%; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 12px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; outline: none; transition: border-color 0.15s; margin-bottom: 7px; }
input[type='date'] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; max-width: 100%; }
.cr-input:focus { border-color: var(--cognac); }
.cr-input::placeholder { color: var(--txt-3); }

.cr-client-suggest { position: relative; }.cr-suggest-dd { position: absolute; top: calc(100% - 4px); left: 0; right: 0; background: var(--surface-2); border: 1px solid var(--field-border); border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 40; display: none; box-shadow: var(--receipt-shadow); }
.cr-suggest-dd.open { display: block; }
.cr-suggest-opt { padding: 10px 13px; font-size: 13px; color: var(--txt); cursor: pointer; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; }
.cr-suggest-opt:last-child { border-bottom: none; }
.cr-suggest-opt:hover { background: var(--hover); }
.cr-suggest-opt .sug-phone { color: var(--txt-3); font-size: 11px; }

.cr-msg-pick { display: flex; gap: 8px; margin-bottom: 4px; }
.cr-msg-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: 8px;
  border: 1px solid var(--field-border); background: transparent;
  color: var(--txt-2); font-family: 'Commissioner', sans-serif;
  font-size: 12px; font-weight: 300; cursor: pointer;
  transition: all 0.15s;
}
.cr-msg-btn svg { width: 17px; height: 17px; }
.cr-msg-btn .msg-ico { color: var(--txt-3); transition: color 0.15s; }
.cr-msg-btn .msg-ico svg { fill: currentColor; }
.cr-msg-btn:hover { border-color: var(--cognac-border); color: var(--txt); }

.cc-inline-input { border: none; border-bottom: 1px dashed var(--cognac-border); background: transparent; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; text-align: right; padding: 2px 0; width: 140px; }
.cc-inline-input:focus { outline: none; border-bottom-color: var(--cognac); }
.cc-msg-picker { display: flex; gap: 6px; }
.cc-msg-btn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--field-border); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--txt-3); }
.cc-msg-btn svg { width: 14px; height: 14px; fill: currentColor; }
.cc-msg-btn.active { border-color: transparent; color: #fff; }
.cr-msg-btn.active { border-color: transparent; color: #fff; }

.itemcard { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.itemcard-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.itemcard-num { font-family: 'Tenor Sans', serif; font-size: 11px; color: var(--cognac); letter-spacing: 0.15em; }
.itemcard-rm { background: none; border: none; color: var(--txt-3); cursor: pointer; font-size: 17px; line-height: 1; padding: 0; transition: color 0.15s; }
.itemcard-rm:hover { color: var(--st-postponed-fg); }
.ic-row { display: flex; gap: 8px; margin-bottom: 9px; }
.rw-sel { position: relative; margin-bottom: 8px; }
.rw-sel-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 12px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; text-align: left; }
.rw-sel-btn.ph { color: var(--txt-3); }
.rw-sel-chev { width: 15px; height: 15px; color: var(--txt-3); transition: transform 0.15s; flex-shrink: 0; }
.rw-sel.open .rw-sel-chev { transform: rotate(180deg); }
.rw-sel-dd { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-2); border: 1px solid var(--field-border); border-radius: 8px; box-shadow: 0 8px 24px rgba(58,50,40,0.14); z-index: 50; max-height: 240px; overflow-y: auto; display: none; }
.rw-sel.open .rw-sel-dd { display: block; }
.rw-opt { padding: 9px 12px; font-size: 13px; color: var(--txt); cursor: pointer; }
.rw-opt:hover { background: var(--hover); }
.rw-opt.sel { color: var(--cognac); background: var(--accent-soft); }
.ic-details { margin: 10px 0 4px; }
.ic-details-toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 7px; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 12px; cursor: pointer; padding: 8px 13px; transition: all 0.15s; }
.ic-details-toggle:hover { border-color: var(--cognac); color: var(--txt); }
.ic-details-body { margin-top: 8px; padding: 12px 13px; background: var(--field-bg); border: 1px solid var(--line-soft); border-radius: 8px; }
.ic-details-row { margin-bottom: 0; }
.ic-details-row .ic-field { flex: 1; min-width: 0; }
.ic-note-wrap { margin-top: 12px; }
.ic-note-label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt-3); margin-bottom: 5px; }
.ic-note { width: 100%; box-sizing: border-box; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 8px 11px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; outline: none; resize: vertical; min-height: 40px; }
.ic-note:focus { border-color: var(--cognac); }
.ic-note::placeholder { color: var(--txt-3); }
.d-item-note { margin: 5px 0 2px; font-size: 12px; font-style: italic; color: var(--txt-2); }
.ic-add-svc-btn { width: 100%; display: block; margin-top: 10px; background: var(--accent-soft); border: 1px solid var(--cognac-border); border-radius: 8px; color: var(--cognac); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 500; padding: 11px; cursor: pointer; transition: all 0.15s; }
.ic-add-svc-btn:hover { background: var(--cognac); color: #fff; }
.ic-add-svc-btn.open { background: var(--cognac); color: #fff; border-radius: 8px 8px 0 0; }
.ic-add-panel { margin-top: 0; padding: 12px 13px; background: var(--field-bg); border: 1px solid var(--cognac-border); border-top: none; border-radius: 0 0 8px 8px; }
.ic-manual-label { font-size: 10px; color: var(--txt-3); margin-top: 10px; margin-bottom: 6px; }
.ic-field { flex: 1; }
.ic-field label { display: block; font-size: 10px; color: var(--txt-3); letter-spacing: 0.08em; margin-bottom: 5px; }
.ic-select, .ic-mini { width: 100%; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 11px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; outline: none; }
.ic-select:focus, .ic-mini:focus { border-color: var(--cognac); }
.ic-mini::placeholder { color: var(--txt-3); }
.ic-select option { background: var(--surface-2); color: var(--txt); }

.svc-count { font-size: 12px; color: var(--txt-2); margin-bottom: 8px; }
.svc-count b { color: var(--cognac); }
.ic-svclist { margin-top: 4px; border: 1px solid var(--line-soft); border-radius: 9px; overflow: hidden; }
.ic-svclist:empty { display: none; }
.ic-svcrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.ic-svcrow:last-child { border-bottom: none; }
.ic-svc-grip { color: var(--field-border); font-size: 12px; flex-shrink: 0; }
.ic-svcnum { font-size: 12px; color: var(--txt-3); flex-shrink: 0; }
.ic-svcname { flex: 1; min-width: 0; font-size: 13.5px; color: var(--txt); overflow-wrap: anywhere; }
.ic-svcprice { font-size: 13.5px; font-weight: 600; color: var(--cognac); white-space: nowrap; flex-shrink: 0; cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.15s; }
.ic-svcprice:hover { border-bottom-color: var(--cognac-border); }
.ic-svcprice-input { width: 68px; background: var(--field-bg); border: 1px solid var(--cognac); border-radius: 5px; padding: 4px 7px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 12px; font-weight: 300; outline: none; text-align: right; }
.ic-svcdel { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: none; border: 1px solid transparent; border-radius: 50%; color: var(--txt-3); cursor: pointer; font-size: 20px; line-height: 1; transition: all 0.15s; }
.ic-svcdel:hover { background: #FBEAE9; border-color: #E5B9B6; color: #C0463E; }
.ic-svcdel:hover { color: var(--st-postponed-fg); }

.ic-search-row { display: flex; gap: 8px; margin-top: 10px; }
.ic-search-cat { flex: 0 0 118px; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 6px; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 11.5px; font-weight: 300; outline: none; }
.ic-search-row .ic-search-wrap { flex: 1; margin-top: 0; }
.ic-search-wrap { position: relative; margin-top: 10px; }
.ic-search { width: 100%; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 11px 12px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13.5px; font-weight: 300; outline: none; }
.ic-search:focus { border-color: var(--cognac); }
.ic-search::placeholder { color: var(--txt-3); }

/* «Термін» — три рівні пілюлі в один ряд */

/* мʼяке поджаття вертикалі — лише сторінка створення */

/* ═══════════════ МОДАЛКА ДЕТАЛЕЙ ЗАМОВЛЕННЯ ═══════════════ */
.odm-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 300;
  align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto;
}
.odm-bg.open { display: flex; }
.odm-bg.odm-center { align-items: center; }

.odm {
  background: var(--bg); border-radius: 14px;
  width: 900px; max-width: 100%;
  box-shadow: 0 24px 64px rgba(0,0,0,0.35);
  position: relative;
  animation: odmIn 0.18s ease;
}
@keyframes odmIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.odm-close {
  position: absolute; top: 14px; right: 16px;
  cursor: pointer; font-size: 24px; line-height: 1;
  color: var(--txt-2); z-index: 2; padding: 4px 8px; border-radius: 6px;
  transition: background 0.15s;
}

.odm-scroll { max-height: 88vh; overflow-y: auto; padding: 26px 30px 30px; }

@media (max-width: 768px) {

  .odm-scroll { max-height: 100vh; padding: 20px 18px 30px; }
}

.d-client-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }

.brought-list { margin: 2px 0 8px; }

.d-note-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt-3); margin: 4px 0 6px; }

.d-issue-mini { flex-shrink: 0; background: var(--cognac); border: none; border-radius: 7px; color: #fff; font-family: 'Commissioner', sans-serif; font-size: 11px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }

.status-row { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
.issue-order-btn { width: 100%; background: var(--cognac); border: none; border-radius: 8px; color: #fff; font-family: 'Commissioner', sans-serif; font-size: 12.5px; padding: 12px; cursor: pointer; }

       (orientation: portrait) and (max-width: 1180px),

.d-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.d-item:last-child { border-bottom: none; padding-bottom: 2px; }
.d-item-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }

/* ── Послуги виробу зі своїм статусом ── */
.svc-list { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 10px; }
.svc-card { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }

.d-rail-v-dot.done { background: var(--cognac); color: #fff; border-color: var(--cognac); }
.d-rail-v-dot.active { border-color: var(--cognac); color: var(--cognac); }
.d-rail-v-lbl { font-size: 8.5px; color: var(--txt-3); margin-top: 3px; text-align: center; }
.d-rail-v-lbl.active { color: var(--txt); font-weight: 500; }
.d-rail-v-line { height: 1px; background: var(--line); flex: 1; margin-bottom: 17px; }
.d-rail-v-line.done { background: var(--cognac); }
.d-rail-v-action { min-width: 38px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--cognac); color: #fff; font-size: 9.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer; }
.d-hist-label { font-size: 10px; color: var(--txt-3); }
.d-hist-value { font-size: 11.5px; color: var(--txt); margin: 1px 0 8px; }

.d-pay-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }

.d-bonus-hint { font-size: 11px; color: var(--txt-3); margin-top: 10px; font-style: italic; }
.settle-methods { display: flex; gap: 8px; margin: 12px 0; }
.settle-methods .cr-pill { flex: 1; text-align: center; }
.settle-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 5; border-radius: 14px; }
.settle-card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 22px; width: 340px; max-width: 90%; box-shadow: 0 16px 48px rgba(0,0,0,0.3); }

/* ── Списання бонусів (поруч із кнопкою оплати, без окремого модального вікна) ── */

.d-bonus-spend-btn:hover { background: rgba(47,169,140,0.08); }
.bonus-calc { background: var(--surface); border: 1px solid rgba(47,169,140,0.3); border-radius: 9px; padding: 12px 14px; margin-top: 10px; }
.bonus-spend-input { border-color: rgba(47,169,140,0.4) !important; }
.bonus-calc-preview { background: rgba(47,169,140,0.07); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.bcp-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--txt-2); margin-bottom: 4px; }

.d-notify { display: flex; gap: 6px; flex-wrap: nowrap; }
.d-notify-btn { flex: 1; min-width: 0; background: transparent; border: 1px solid var(--cognac-border); border-radius: 7px; padding: 8px 4px; color: var(--cognac); font-family: 'Commissioner', sans-serif; font-size: 10.5px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
.d-notify-btn:hover { background: var(--accent-soft); }
.d-notify-btn svg { width: 12px; height: 12px; stroke-width: 1.8; flex-shrink: 0; }

/* ═══════════════ ВКЛАДКА ЗАМОВЛЕННЯ ═══════════════ */
.filters {
  display: flex; align-items: center; gap: 18px;
  padding: 0 28px 14px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filters-secondary { padding-top: 14px; border-bottom: 1px solid var(--line); }
.ftab {
  font-size: 12px; color: var(--txt-2); cursor: pointer;
  padding-bottom: 12px; white-space: nowrap;
  border-bottom: 2px solid transparent;
  background: none; border-top: none; border-left: none; border-right: none;
  font-family: 'Commissioner', sans-serif; font-weight: 300;
  transition: color 0.15s;
}

  border-radius: 7px; padding: 6px 11px;
}

.search-box input {
  background: none; border: none; outline: none;
  color: var(--txt); font-family: 'Commissioner', sans-serif;
  font-size: 12px; font-weight: 300; width: 130px;
}

.cr-head-btns { display: flex; gap: 8px; }
.cr-head-btn { background: transparent; border: 1px solid var(--field-border); border-radius: 8px; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 12px; padding: 9px 14px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.cr-head-btn:hover { border-color: var(--cognac); color: var(--txt); }
.cr-head-btn.primary { background: var(--btn-primary-bg, #3A3228); border-color: transparent; color: #fff; }
.cr-head-btn.primary:hover { background: var(--leather); color: #fff; }
.cr-head-btn-danger { border-color: rgba(226,75,74,0.35); color: #E24B4A; }
.cr-head-btn-danger:hover { background: rgba(226,75,74,0.08); border-color: #E24B4A; color: #E24B4A; }
.cr-draft-bar { max-width: 1200px; width: 100%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent-soft); border: 1px solid var(--cognac-border); border-radius: 8px; padding: 9px 16px; font-size: 12px; color: var(--txt); }
.cr-draft-bar span { display: flex; gap: 8px; }
.cr-draft-bar button { background: none; border: 1px solid var(--cognac-border); border-radius: 6px; color: var(--cognac); font-family: 'Commissioner', sans-serif; font-size: 11px; padding: 5px 11px; cursor: pointer; }
@media (max-width: 620px) {
  .cr-head-btn { padding: 8px 10px; font-size: 11px; }
  .cr-head-btns { gap: 6px; }
}
.orders-scroll { flex: 1; overflow-y: auto; padding: 14px 28px 28px; }
.orders-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px), (orientation: portrait) { .orders-grid { grid-template-columns: 1fr; } }
.order-card { background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--cognac); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; -webkit-touch-callout: none; }
.order-card:hover { border-color: var(--field-border); }
.order-card.important { border-color: #C0392B; background: rgba(192,57,43,0.05); box-shadow: inset 0 0 0 1px rgba(192,57,43,0.3); }
.ocard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.ocard-top-right { display: flex; align-items: center; gap: 8px; }
.ocard-flag { background: none; border: none; padding: 2px; cursor: pointer; color: var(--txt-3); display: flex; }
.ocard-flag svg { width: 15px; height: 15px; }
.ocard-flag.on { color: #C0392B; }
.ocard-name { font-size: 14px; color: var(--txt); }
.ocard-sub { font-size: 11px; color: var(--txt-3); margin-top: 2px; }
.ocard-item { font-size: 12px; color: var(--txt-2); margin-top: 6px; }
.ocard-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.ocard-foot .oc-svc { font-size: 11px; color: var(--txt-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ocard-foot .oc-date { font-size: 11px; color: var(--txt-2); white-space: nowrap; }
.ocard-foot .oc-date.warn { color: var(--st-postponed-fg); }
.orders-scroll { overflow-x: visible; }
.orders-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.olcol { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.olr { position: relative; padding: 12px 15px; border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background 0.12s; }
.olr:last-child { border-bottom: none; }
.olr:hover { background: var(--hover); }

.olr-1 { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.olr-num { font-weight: 500; color: var(--leather); font-size: 13px; white-space: nowrap; flex-shrink: 0; }
.olr-1-spacer { flex: 1; }
.attn-ico { flex-shrink: 0; width: 19px; height: 19px; border-radius: 6px; background: rgba(226,75,74,0.12); color: #E24B4A; display: flex; align-items: center; justify-content: center; }
.attn-ico.attn-warn { background: rgba(239,159,39,0.15); color: #EF9F27; }
.attn-ico svg { width: 11px; height: 11px; }
.olr-badge { flex-shrink: 0; }
.olr-2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
.olr-who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.olr-who .nm { font-weight: 500; color: var(--txt); }

/* ═══ ПЛАН ═══ */
.plan-wrap { display: flex; gap: 20px; align-items: flex-start; padding: 0 28px 40px; }

.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }

.plan-row-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-row-meta { font-size: 11px; color: var(--txt-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-badge { font-size: 9.5px; font-weight: 700; padding: 4px 10px; border-radius: 12px; white-space: nowrap; flex-shrink: 0; text-align: center; }
.plan-badge.b-work { background: var(--st-work-bg); color: var(--st-work-fg); }
.plan-badge.b-new { background: var(--st-new-bg); color: var(--st-new-fg); }
.plan-badge.b-ready { background: var(--st-ready-bg); color: var(--st-ready-fg); }
.plan-badge.b-late { background: var(--st-postponed-bg); color: var(--st-postponed-fg); }
.plan-row-arrow { color: var(--txt-3); flex-shrink: 0; transition: transform .15s; }

.plan-issue-btn { padding: 7px 15px; border: none; border-radius: 8px; background: var(--cognac); color: #fff; font-size: 11.5px; font-weight: 700; cursor: pointer; flex-shrink: 0; font-family: 'Commissioner', sans-serif; }
.plan-bell { width: 30px; height: 30px; border-radius: 9px; background: var(--st-work-bg); color: var(--st-work-fg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }

.plan-accordion { background: var(--bg); border-top: 1px solid var(--line-soft); padding: 9px 18px 10px 74px; }

.plan-svc-name { font-size: 12px; color: var(--txt); flex: 1; min-width: 0; }

.plan-svc-master-chip.m-oleksandr { background: rgba(59,110,113,0.14); color: #2F6366; }
.plan-svc-master-chip.m-serhii { background: rgba(122,74,107,0.14); color: #6B3A5D; }

.plan-svc-btn { padding: 6px 12px; border: none; border-radius: 8px; background: var(--cognac); color: #fff; font-size: 10.5px; font-weight: 700; cursor: pointer; font-family: 'Commissioner', sans-serif; flex-shrink: 0; }

.plan-svc-done { font-size: 10.5px; color: var(--st-ready-fg); font-weight: 600; flex-shrink: 0; }

.plan-cal-page-block { padding: 0 16px 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.plan-cal-page-row2 { display: flex; align-items: baseline; gap: 8px; }

.plan-side-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; margin-bottom: 14px; }

.plan-cal-day { font-size: 10.5px; padding: 6px 0; border-radius: 6px; color: var(--txt); position: relative; cursor: pointer; }

.plan-cal-day.today { background: var(--cognac); color: #fff; font-weight: 700; }

.q-card { text-align: center; }
.q-text { font-family: 'Tenor Sans', serif; font-size: 13px; color: var(--txt-2); line-height: 1.6; letter-spacing: 0.02em; }
.q-attrib { font-family: 'Tenor Sans', serif; font-size: 9px; color: var(--cognac); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 8px; }
.q-actions { display: flex; justify-content: center; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.q-act { font-size: 15px; color: var(--txt-3); cursor: pointer; transition: color 0.15s; }
.q-act.active { color: var(--cognac); }
.plan-cal-day .dot { position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: var(--st-postponed-fg); }
.plan-cal-filter-note { margin-top: 10px; font-size: 10.5px; color: var(--txt-2); }
.plan-cal-filter-note span { color: var(--cognac); font-weight: 600; cursor: pointer; }

.plan-money-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); }
.plan-money-row:first-child { border-top: none; }
.plan-money-lbl { font-size: 11px; color: var(--txt-2); }
.plan-money-val { font-family: 'Tenor Sans', serif; font-size: 14px; }
.plan-money-val.debt { color: var(--st-postponed-fg); }
.plan-money-val.work { color: var(--st-work-fg); }

@media (orientation: portrait) and (max-width: 1180px) {
  .plan-wrap { flex-direction: row; padding: 0 12px 30px; gap: 10px; }
  .plan-side { width: 230px; }
  .plan-tiles { grid-template-columns: repeat(2,1fr); }
  .plan-row-meta { display: block; }

.hist-link { cursor: pointer; }
.hist-link:hover { opacity: 0.75; }
.hist-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.hist-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s; }
.hist-row:hover { border-color: var(--cognac-border); }
.hist-row-top { display: flex; justify-content: space-between; align-items: center; }
.hist-num { font-family: 'Tenor Sans', serif; font-size: 12.5px; color: var(--cognac); letter-spacing: 0.03em; }
.hist-row-bottom { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
.hist-date { font-size: 12px; color: var(--txt-3); }
.hist-total { font-size: 12.5px; color: var(--txt); font-weight: 500; }
.hist-current { border-color: var(--cognac-border); background: var(--accent-soft); }

/* ── Картка клієнта: двоколонковий вигляд (стиль чека) ── */
.cc-head { text-align: center; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); margin-bottom: 18px; }
.cc-name { font-family: 'Tenor Sans', serif; font-size: 17px; color: var(--txt); }
.cc-name-tag { font-size: 12px; color: var(--txt-3); margin-top: 2px; }
.cc-substatus { font-size: 11px; color: var(--txt-3); margin-top: 4px; }
.cc-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 26px; }
.cc-col-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--cognac); margin-bottom: 11px; }
.cc-field-label { font-size: 11px; color: var(--txt-3); }
.cc-field-value { font-size: 13px; color: var(--txt); margin: 2px 0 10px; }
.cc-stats-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 10px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.cc-stats-2col .cc-field-value { margin-bottom: 0; }
.cc-bonus-value { font-family: 'Tenor Sans', serif; font-size: 16px; color: var(--cognac); margin-top: 2px; }
.cc-hist-list { display: flex; flex-direction: column; gap: 8px; }
.cc-hist-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color 0.15s; }
.cc-hist-row:hover { border-color: var(--cognac-border); }
.cc-hist-row:hover .cc-hist-num { color: var(--cognac); }
.cc-hist-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; }
.cc-hist-num { font-family: 'Tenor Sans', serif; color: var(--txt-3); letter-spacing: .03em; transition: color 0.12s; }
.cc-hist-sum { font-weight: 500; color: var(--txt); }
.cc-hist-item { font-size: 12.5px; color: var(--txt); margin-top: 3px; }
.cc-more-btn { width: 100%; margin-top: 8px; background: none; border: 1px dashed var(--cognac-border); border-radius: 7px; color: var(--cognac); font-family: 'Commissioner', sans-serif; font-size: 11.5px; padding: 8px; cursor: pointer; }

/* ═══════════════ ВКЛАДКИ КЛІЄНТИ / ФІНАНСИ / СТАТИСТИКА ═══════════════ */
.tab-scroll { flex: 1; overflow-y: auto; padding: 8px 28px 40px; }
.period-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; padding: 0 28px; }
.ptab { padding: 8px 15px; border-radius: 18px; border: 1px solid var(--field-border); background: transparent; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 12px; font-weight: 300; cursor: pointer; transition: all 0.15s; }
.ptab.active { background: var(--cognac); color: #fff; border-color: var(--cognac); }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; padding: 0 28px; }

/* Плитки-фільтри сторінки "Замовлення" — окремі класи, щоб не чіпати статичні
   stat-card на інших сторінках (фінанси, клієнти), які лишаються некликабельними. */
.ord-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; padding: 0 28px; }
.ord-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 14px; cursor: pointer; transition: all .15s; text-align: left; font-family: inherit; width: 100%; }
.ord-tile:hover { border-color: var(--cognac-border); box-shadow: 0 3px 12px rgba(160,132,92,.12); }
.ord-tile.on { border-color: var(--cognac); background: var(--cognac-light); }
.ord-tile.on .ord-tile-value { color: var(--leather); }
.ord-tile-label { font-size: 10px; color: var(--txt-3); letter-spacing: .04em; margin-bottom: 7px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ord-tile-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ord-tile-value { font-family: 'Tenor Sans', serif; font-size: 21px; color: var(--txt); }
.ord-tile-value.accent { color: var(--cognac); }
.ord-tile-sub { font-size: 11px; color: var(--txt-3); white-space: nowrap; }
.ord-tile-sub b { color: var(--txt-2); font-weight: 600; }

.page-head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg-pill { display: flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--surface); flex-shrink: 0; }
.seg-btn { border: none; background: none; color: var(--txt-2); font-size: 12px; padding: 7px 12px; cursor: pointer; font-family: inherit; white-space: nowrap; border-right: 1px solid var(--line); }
.seg-btn:last-child { border-right: none; }
.seg-btn.on { background: var(--cognac); color: #fff; }
.pill-toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--txt-2); font-size: 12px; padding: 7px 13px 7px 11px; border-radius: 20px; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
.pill-toggle:hover { border-color: var(--cognac-border); }
.pill-toggle .pill-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .15s; display: inline-block; }
.pill-toggle.on { border-color: var(--cognac-border); background: var(--cognac-light); color: var(--leather); }
.pill-toggle.on .pill-dot { background: var(--cognac); }

@media (max-width: 620px) {
  .ord-tiles { grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 0 18px; }
  .ord-tile { padding: 11px 10px; }
  .ord-tile-label { font-size: 9px; }
  .ord-tile-value { font-size: 17px; }
  .ord-tile-sub { font-size: 10px; }
  .page-head-right { width: 100%; justify-content: space-between; }
}
.stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 16px 18px; }

.stat-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.bar-item { margin-bottom: 15px; }
.bar-item:last-child { margin-bottom: 0; }
.bar-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; }
.bar-name { font-size: 13px; color: var(--txt); }
.bar-meta { font-size: 12px; color: var(--cognac); white-space: nowrap; }

.clients-list { display: flex; flex-direction: column; gap: 8px; }

.rating-opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.rating-opt { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 9px; border: 1px solid var(--field-border); background: transparent; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }

.client-dot { font-size: 12px; }
.client-name { font-size: 13px; color: var(--txt); }
.client-phone { font-size: 12px; color: var(--txt-3); }
.client-count { font-size: 11px; color: var(--txt-3); text-align: right; }
.client-sum { font-size: 12px; color: var(--cognac); text-align: right; }
.pay-split { display: flex; gap: 10px; margin-top: 4px; }
.pay-split-item { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
.pay-split-item .ps-label { font-size: 10px; color: var(--txt-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.pay-split-item .ps-value { font-family: 'Tenor Sans', serif; font-size: 16px; color: var(--txt); }
.pay-split-item .ps-sub { font-size: 11px; color: var(--txt-3); margin-top: 4px; }
.pay-split-item.clickable { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.pay-split-item.clickable:hover { border-color: var(--cognac-border); background: var(--hover); }

.punct-list { display: flex; flex-direction: column; gap: 8px; }
.punct-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }

.punct-main { flex: 1; min-width: 0; }
.punct-title { font-size: 13px; color: var(--txt); }
.punct-sub { font-size: 11px; color: var(--txt-3); margin-top: 3px; }

.task-add-form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 18px; }

.task-add-row { display: flex; gap: 8px; align-items: flex-start; }
.task-order-search { flex: 1; position: relative; }

.task-order-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; background: var(--accent-soft); color: var(--cognac); border-radius: 14px; padding: 5px 10px; font-size: 11px; }
.task-order-chip button { background: none; border: none; color: var(--cognac); cursor: pointer; font-size: 13px; padding: 0; }
.task-add-btn { background: var(--cognac); border: none; border-radius: 8px; color: #fff; font-size: 20px; width: 44px; height: 38px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
.task-add-btn:hover { background: var(--leather); }

.task-text { flex: 1; font-size: 13px; color: var(--txt); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-row.done .task-text { text-decoration: line-through; }
.task-order { display: inline-block; font-size: 11px; color: var(--cognac); cursor: pointer; padding: 2px 8px; background: var(--accent-soft); border-radius: 10px; }
.task-deadline { font-size: 11px; color: var(--txt-3); }
.task-deadline.overdue { color: var(--st-postponed-fg); font-weight: 500; }
.task-del { background: none; border: none; color: var(--txt-3); cursor: pointer; font-size: 18px; padding: 0 4px; transition: color 0.15s; }
.task-del:hover { color: var(--st-postponed-fg); }
.task-done-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--txt-3); margin: 20px 0 12px; }

/* ═══════════════ ВХІД ═══════════════ */
.login-bg {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

.login-card {

.login-sub { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cognac); text-align: center; margin: 6px 0 24px; }

}

}

.role-badge-float {

/* Приймальник: приховуємо редагування карток, бонуси та рейтинг */

body[data-role="operator"] .admin-only { display: none !important; }

/* ═══════════════ ФОТО ВИРОБУ ═══════════════ */
.tailor-area {
  min-height: 78px; resize: vertical; line-height: 1.55;
  font-family: 'Commissioner', sans-serif;
}
.photo-area { min-height: 92px; font-size: 12px; }
.tailor-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.tl-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.photo-empty { font-size: 12px; color: var(--txt-3); font-style: italic; padding: 6px 0; }

.tailor-photo { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--accent-soft); border: 1px solid var(--line); }
.tailor-photo img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }

#photo-viewer {
  display: none; position: fixed; inset: 0; z-index: 600;

  padding: 24px; cursor: zoom-out;
}

/* ═══════════════ КАРТКИ ВИГОТОВЛЕННЯ ═══════════════ */
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 14px; }
.tcard {
  background: var(--surface); border: 1px solid var(--line);

.tc-photo .tc-img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }

}

.tc-body { padding: 12px 14px 13px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.tc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tc-num { font-size: 11px; color: var(--txt-3); }
.tc-title { font-size: 14px; color: var(--txt); line-height: 1.3; }
.tc-sub { font-size: 11px; color: var(--txt-3); line-height: 1.4; }
.tc-product { font-size: 11px; color: var(--txt-3); line-height: 1.35; margin-top: 2px; }
.tc-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; }
.tc-date { font-size: 11px; color: var(--txt-3); }

@media (max-width: 620px) {
  .tcards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tc-title { font-size: 13px; }
}

/* ═══════════════ ОНЛАЙН-ПРАЙС ═══════════════ */
.pl-wrap { max-width: 860px; margin: 0 auto; }
.pl-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.pl-tab { flex: 1; text-align: center; padding: 12px; border-radius: 10px; background: transparent; border: 1px solid var(--field-border); color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 15px; cursor: pointer; transition: all 0.15s; }
.pl-tab:hover { border-color: var(--cognac); }

.pl-searchbar { display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1px solid var(--field-border); border-radius: 10px; padding: 11px 14px; margin-bottom: 12px; }

.pl-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 16px; }
.pl-filter { padding: 7px 14px; border-radius: 18px; border: 1px solid var(--field-border); background: transparent; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }

.pl-cards { column-count: 2; column-gap: 10px; }

@media (max-width: 720px) { .pl-cards { column-count: 1; } }
.pl-scard { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: background 0.12s, box-shadow 0.12s; }
.pl-scard:hover { background: var(--hover); }
.pl-scard.pl-lit { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--cognac); }
.pl-scard-name { font-size: 14px; color: var(--txt); line-height: 1.35; }
.pl-scard-hint { font-size: 11px; color: var(--txt-3); margin-top: 3px; line-height: 1.4; }
.pl-scard-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 9px; }
.pl-scard-price { font-family: 'Tenor Sans', serif; font-size: 17px; color: var(--cognac); white-space: nowrap; }
.pl-scard-price .pl-unit { font-family: 'Commissioner', sans-serif; font-size: 11px; color: var(--txt-3); }
.pl-scard-term { font-size: 11px; color: var(--txt-3); white-space: nowrap; }
.pl-card-label { display: flex; align-items: center; font-family: 'Tenor Sans', serif; font-size: 14px; letter-spacing: 0.01em; color: var(--txt); background: var(--accent-soft); padding: 13px 18px; border-bottom: 1px solid var(--cognac-border); cursor: grab; user-select: none; -webkit-user-select: none; }
.pl-card-label:active { cursor: grabbing; }
.pl-grip { display: inline-flex; color: var(--cognac); margin-right: 9px; opacity: 0.6; flex-shrink: 0; }
.pl-ghost { opacity: 0.35; }
.pl-drag { box-shadow: 0 14px 34px rgba(58,50,40,0.2); }
.pl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background 0.12s, box-shadow 0.12s; }
.pl-row:last-child { border-bottom: none; padding-bottom: 15px; }
.pl-row:hover { background: var(--hover); }
.pl-row.pl-lit { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--cognac); }
.pl-row.pl-lit .pl-price { color: var(--leather); }
.pl-name { flex: 1; min-width: 0; font-size: 13px; color: var(--txt); line-height: 1.35; }
.pl-hint { font-size: 10px; color: var(--txt-3); margin-top: 3px; line-height: 1.4; }
.pl-price { font-family: 'Tenor Sans', serif; font-size: 15px; color: var(--cognac); white-space: nowrap; flex-shrink: 0; }
.pl-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }

@media (max-width: 680px) {

}

/* ═══════════════ НАЛАШТУВАННЯ ═══════════════ */
.price-row { display: grid; grid-template-columns: 1fr 76px 84px 74px 44px 40px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.price-row:last-of-type { border-bottom: none; }

.price-editor-wrap { max-width: 640px; margin: 0 auto; }

.price-name-cell { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.price-name-input { flex: 1; min-width: 80px; text-align: left; font-size: 13px; padding: 6px 8px; }
.price-hidden-tag { font-size: 10px; color: var(--txt-3); }
.price-unit { font-size: 11px; color: var(--txt-3); }
.price-input { background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 7px 9px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; outline: none; width: 100%; text-align: right; }

.price-add { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--cognac-border); align-items: center; }

.price-row.pending { background: var(--accent-soft); border-radius: 7px; padding-left: 8px; padding-right: 8px; }
.price-was { font-size: 10px; color: var(--txt-3); text-decoration: line-through; }
.price-new-tag { font-size: 10px; color: #2FA98C; }
.price-input-static { font-size: 13px; color: var(--cognac); text-align: right; }

.pending-bar {
  position: sticky; bottom: 0; margin-top: 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--cognac-border);
  border-radius: 10px; padding: 12px 16px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
}
.pending-count { flex: 1; font-size: 13px; color: var(--txt); }
.pending-cancel { background: none; border: 1px solid var(--field-border); border-radius: 7px; color: var(--txt-2); padding: 9px 14px; cursor: pointer; font-family: 'Commissioner', sans-serif; font-size: 12px; }
.pending-confirm { background: var(--cognac); border: none; border-radius: 7px; color: #fff; padding: 9px 16px; cursor: pointer; font-family: 'Commissioner', sans-serif; font-size: 12px; }

.chg-list { border: 1px solid var(--line); border-radius: 9px; padding: 6px 14px; }
.chg-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }

.param-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }

/* ═══════════════ КАЛЕНДАР ═══════════════ */
.cal-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.cal-nav-btn { background: transparent; border: 1px solid var(--field-border); border-radius: 7px; color: var(--txt-2); width: 34px; height: 34px; cursor: pointer; font-size: 16px; transition: all 0.15s; }
.cal-nav-btn:hover { border-color: var(--cognac); color: var(--txt); }
.cal-month { font-family: 'Tenor Sans', serif; font-size: 18px; color: var(--txt); min-width: 190px; }
.cal-today-btn { background: transparent; border: 1px solid var(--cognac-border); border-radius: 7px; color: var(--cognac); padding: 7px 13px; font-family: 'Commissioner', sans-serif; font-size: 12px; cursor: pointer; }
.cal-today-btn:hover { background: var(--accent-soft); }
.cal-filters { margin-left: auto; display: flex; gap: 6px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt-3); text-align: center; padding-bottom: 4px; }
.cal-cell { min-height: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; cursor: pointer; transition: border-color 0.15s, background 0.15s; overflow: hidden; }
.cal-cell:hover { border-color: var(--cognac-border); }
.cal-cell.other { opacity: 0.4; }
.cal-cell.today { border-color: var(--cognac); background: var(--accent-soft); }
.cal-daynum { font-size: 12px; color: var(--txt-2); margin-bottom: 5px; }
.cal-dayhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.cal-dayhead .cal-daynum { margin-bottom: 0; }
.cal-load { font-size: 9px; font-weight: 500; padding: 1px 6px; border-radius: 8px; line-height: 1.4; }
.cal-load.free { background: rgba(47,169,140,0.16); color: #2FA98C; }
.cal-load.busy { background: var(--st-work-bg); color: var(--st-work-fg); }
.cal-load.full { background: var(--st-postponed-bg); color: var(--st-postponed-fg); }
.cr-deadline-hint { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.deadline-load { font-size: 12px; padding: 7px 11px; border-radius: 7px; }
.deadline-load.free { background: rgba(47,169,140,0.14); color: #2FA98C; }
.deadline-load.busy { background: var(--st-work-bg); color: var(--st-work-fg); }
.deadline-load.full { background: var(--st-postponed-bg); color: var(--st-postponed-fg); }
.deadline-reco { background: transparent; border: 1px dashed var(--cognac-border); border-radius: 7px; color: var(--cognac); font-family: 'Commissioner', sans-serif; font-size: 12px; padding: 9px 12px; cursor: pointer; text-align: left; transition: background 0.15s; }
.deadline-reco:hover { background: var(--accent-soft); }
.cal-cell.today .cal-daynum { color: var(--cognac); font-weight: 500; }
.cal-ev { font-size: 10px; padding: 2px 6px; border-radius: 5px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev.order { background: rgba(160,132,92,0.16); color: var(--cognac); }
.cal-ev.task { background: rgba(47,169,140,0.16); color: #2FA98C; }
.cal-ev.tailor { background: rgba(115,96,242,0.16); color: #7360F2; }
.cal-ev.late { background: var(--st-postponed-bg); color: var(--st-postponed-fg); }
.cal-more { font-size: 9px; color: var(--txt-3); }

.cal-day-list { display: flex; flex-direction: column; gap: 8px; }
.cal-day-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; cursor: pointer; }
.cal-day-item:hover { background: var(--hover); }
.cal-tag { font-size: 10px; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.cal-tag.order { background: rgba(160,132,92,0.16); color: var(--cognac); }
.cal-tag.task { background: rgba(47,169,140,0.16); color: #2FA98C; }
.cal-tag.tailor { background: rgba(115,96,242,0.16); color: #7360F2; }
.cal-day-txt { flex: 1; font-size: 13px; color: var(--txt); }
.cal-day-sub { font-size: 11px; color: var(--txt-3); }

/* ═══════════════ ЗВЕДЕНИЙ ЧЕК ═══════════════ */
.summary-search-wrap { margin-bottom: 4px; }
#summary-matches { margin-top: 4px; }
.summary-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; max-height: 55vh; overflow-y: auto; }
.summary-row { display: grid; grid-template-columns: 22px 60px 1.4fr 1.6fr 90px; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; cursor: pointer; font-size: 12px; }
.summary-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--cognac); cursor: pointer; }
.sr-num { color: var(--txt-3); }
.sr-name { color: var(--txt); }
.sr-svc { color: var(--txt-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-sum { color: var(--cognac); text-align: right; }

#summary-print { background: #FBF8F3; color: #1E1E1E; border-radius: 8px; padding: 32px 28px; font-family: 'Commissioner', sans-serif; max-width: 560px; margin: 0 auto; }
[data-theme="dark"] #summary-print { background: var(--linen); }
.sum-print-header { text-align: center; padding-bottom: 16px; border-bottom: 1px solid rgba(58,50,40,0.15); margin-bottom: 16px; }
.sum-print-logo { font-family: 'Tenor Sans', serif; font-size: 13px; letter-spacing: 0.25em; color: var(--brown); }
.sum-print-tag { font-size: 10px; color: #3A3228; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
.sum-print-meta { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #1E1E1E; margin-bottom: 18px; }
.sum-order-block { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(58,50,40,0.1); }
.sum-order-head { font-family: 'Tenor Sans', serif; font-size: 11px; color: var(--cognac); letter-spacing: 0.1em; margin-bottom: 8px; }
.sum-svc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: #1E1E1E; padding: 3px 0; }
.sum-svc-row > span:first-child { flex: 1; min-width: 0; }
.sum-svc-row > span:last-child { white-space: nowrap; flex-shrink: 0; }
.sum-print-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid rgba(58,50,40,0.2); margin-top: 6px; font-family: 'Tenor Sans', serif; font-size: 19px; }
.sum-print-footer { text-align: center; margin-top: 18px; padding-top: 12px; border-top: 1px solid rgba(58,50,40,0.1); font-size: 9px; color: rgba(58,50,40,0.65); letter-spacing: 0.2em; text-transform: uppercase; }
.sum-actions { display: flex; gap: 10px; margin-top: 20px; max-width: 560px; margin-left: auto; margin-right: auto; }

@media print {
  body * { visibility: hidden; }
  #summary-print, #summary-print * { visibility: visible; }
  #summary-print { position: absolute; top: 0; left: 0; width: 100%; box-shadow: none; }
  .no-print, .odm-close, .nav { display: none !important; }
}

/* ═══════════════ МОБІЛЬНА ВЕРСІЯ ═══════════════ */
/* ═══════════════ БОКОВА ПАНЕЛЬ — компактна на невисоких екранах ═══════════════
   Стосується десктопа і планшета в горизонтальній орієнтації. */
.nav { overflow-y: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }

@media (orientation: landscape) and (max-height: 900px) {
  .nav { padding: 12px 0 8px; gap: 1px; justify-content: flex-start; }
  .nav-logo { margin-bottom: 8px; font-size: 14px; }
  .nav-item { padding: 6px 0; gap: 3px; font-size: 8px; }
  .nav-item svg { width: 17px; height: 17px; }
  .nav-div { margin: 3px 0; }
  .nav-theme { width: 36px; height: 32px; }
  .nav-theme svg { width: 15px; height: 15px; }
  .role-badge { font-size: 8px; }
  /* Годинник лишається внизу панелі разом з датою */
  .nav-clock { margin-bottom: 8px; }
  .nav-analog { width: 50px; height: 50px; }
  .nav-clock-date { font-size: 8px; margin-top: 4px; }
}
@media (orientation: landscape) and (max-height: 760px) {
  .nav { width: 74px; min-width: 74px; padding: 8px 0 6px; }
  .nav-logo { margin-bottom: 5px; font-size: 13px; }
  .nav-item { width: 62px; padding: 4px 0; gap: 2px; }
  .nav-item svg { width: 16px; height: 16px; }

  .nav-analog { width: 42px; height: 42px; }

/* Широка панель — на великих екранах */
@media (min-width: 1400px) {
  .nav { width: 172px; min-width: 172px; padding: 20px 0 14px; }
  .nav-item {
    width: 148px; flex-direction: row; justify-content: flex-start;
    gap: 11px; padding: 9px 13px; font-size: 11px; text-align: left;
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
  .nav-div { width: 120px; }
  .nav-analog { width: 82px; height: 82px; }
  .nav-mini-cal { display: block; }
  .role-badge { font-size: 9px; }
}

/* ═══════════════ ПАНЕЛЬ ЗНИЗУ ═══════════════
   Телефон у будь-якій орієнтації + планшет вертикально. */
@media (max-width: 768px),
       (orientation: portrait) and (max-width: 1180px),
       (orientation: landscape) and (max-height: 520px) {
  body { flex-direction: column; }
  .nav {
    width: 100%;
    min-width: 0;
    height: auto;
    flex-direction: row;
    justify-content: space-around;
    position: fixed;
    bottom: 0;
    top: auto;
    padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
    border-right: none;
    border-top: 1px solid var(--nav-border);
    gap: 0;
    overflow: visible;
  }
  .nav-logo { display: none; }
  .nav-item { width: auto; flex: 1; padding: 6px 2px; font-size: 8px; gap: 4px; }
  .nav-item svg { width: 18px; height: 18px; }
  .nav-spacer { display: none; }
  .nav-div { display: none; }
  .nav-clock { display: none; }
  .role-badge, .nav-role-static { display: none; }
  .nav-logout { display: none; }
  .role-badge-float { display: flex; }
  .nav-theme {
    width: auto; flex: 1; height: auto; padding: 6px 2px;
    border: none; border-radius: 9px;
    flex-direction: column; gap: 4px; font-size: 8px;
  }
  .main { padding-bottom: 74px; }
}

/* Дуже вузькі екрани — лишаємо тільки іконки, щоб усе вмістилось */
/* Телефон: ховаємо адмін/зайві розділи, лишаємо 4 робочі вкладки + тему.
   Тільки вузькі екрани (телефон), не планшет у портреті. */
@media (max-width: 620px) {
  .nav .mobile-hide { display: none !important; }
  .nav-item { font-size: 10px; padding: 8px 2px; gap: 4px; }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-theme { font-size: 10px; }
  .nav-theme svg { width: 22px; height: 22px; }
}

.cr-rail{display:flex;align-items:center;margin:0 0 22px;user-select:none}

.cr-rdot{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Tenor Sans',serif;font-size:14px;color:var(--txt-3);transition:.18s}
.cr-rlbl{font-size:11px;letter-spacing:.05em;color:var(--txt-3);white-space:nowrap;transition:.18s}
.cr-rstep.active .cr-rdot{border-color:var(--cognac);background:var(--cognac);color:#fff}
.cr-rstep.active .cr-rlbl{color:var(--txt);font-weight:400}

/* ═══ Карточка замовлення — єдина вертикаль ═══ */
.card-inner{max-width:560px;margin:0 auto}
.n-sec{margin-bottom:18px}
.n-sec-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cognac);margin-bottom:10px;font-weight:600}

/* Орієнтир по трьох секціях картки речі — точка вбудована прямо в кожну
   секцію (n-sec отримує position:relative), тому завжди рівно навпроти
   свого заголовка, незалежно від висоти сусідніх блоків. Спайн — єдина
   декоративна лінія, що з'єднує точки візуально. */
.n-item-body{position:relative;padding-left:46px}
.n-spine{position:absolute;left:17px;top:17px;bottom:17px;width:1.5px;background:var(--line)}
.n-sec{position:relative}
.n-dot{position:absolute;left:-46px;top:0;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Tenor Sans',serif;font-size:14px;color:var(--txt-3);cursor:pointer;transition:.18s;z-index:1}
.n-dot.active{border-color:var(--cognac);background:var(--cognac);color:#fff}
.n-dot.done{border-color:#639922;color:#639922}

@media (max-width:620px){
  .n-item-body{padding-left:38px}
  .n-spine{left:14px;top:14px;bottom:14px}
  .n-dot{left:-38px;width:30px;height:30px;font-size:12px}

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function doLogin() {
  const pw = document.getElementById("login-pw").value;
  const err = document.getElementById("login-err");
  if (!pw) { err.textContent = "Введіть пароль"; return; }
  let hash;
  try { hash = await sha256(pw); }
  catch(e) { err.textContent = "Помилка перевірки"; return; }
  let role = "";
  for (const r in ROLE_HASHES) { if (ROLE_HASHES[r] === hash) role = r; }
  if (!role) { err.textContent = "Невірний пароль"; return; }
  userRole = role;

function gv(obj, ...keys) {
  for (const k of keys) { if (obj[k] !== undefined && obj[k] !== "") return obj[k]; }
  return "";
}

/* gviz віддає дати як "Date(2026,7,8)" (місяць рахується з 0). Приводимо до ДД.ММ.РРРР,
   щоб не показувати клієнту сире значення. Усе, що не дата — лишаємо як є. */
function gvizDate(v) {
  const s = String(v);
  const m = s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
  if (!m) return s;
  const pad = n => String(n).padStart(2, "0");
  let out = pad(m[3]) + "." + pad(parseInt(m[2]) + 1) + "." + m[1];
  if (m[4] !== undefined) out += " " + pad(m[4]) + ":" + pad(m[5]);
  return out;
}

async function parseSheet(res, cols) {
  try {
    const text = await res.text();
    // gviz повертає google.visualization.Query.setResponse({...}); — виріжемо JSON надійно
    const start = text.indexOf("{");
    const end = text.lastIndexOf("}");
    if (start === -1 || end === -1) return [];
    const json = JSON.parse(text.substring(start, end + 1));
    if (!json.table || !json.table.rows) return [];
    return json.table.rows.map(row => {
      const obj = {};
      const cells = row.c || [];
      cols.forEach((col, i) => {
        const cell = cells[i];
        if (!cell) { obj[col] = ""; return; }
        // Пріоритет: значення .v (сире), потім .f (форматоване)
        let val = (cell.v !== null && cell.v !== undefined) ? cell.v : (cell.f !== undefined ? cell.f : "");
        obj[col] = gvizDate(val);
      });
      return obj;
    }).filter(r => {
      const key = r[cols[0]];
      return key && typeof key === "string" && key.indexOf("RW-") === 0;
    });
  } catch(e) { console.error("parseSheet error:", e); return []; }
}

async function parsePartners(res) {
  try {
    const text = await res.text();
    const json = JSON.parse(text.replace(/^.*?({.*}).*$/s, "$1"));
    if (!json.table || !json.table.rows) return [];
    return json.table.rows.map(row => {
      const cell = row.c[0];
      return cell && cell.v ? String(cell.v) : "";
    }).filter(v => v && v !== "Імя" && v !== "Имя");
  } catch(e) { return []; }
}

async function parseServices(res) {

}
/* Послуги конкретного виробу */
function servicesOfItem(itemNum) {
  return SERVICES.filter(s => gv(s,"Номер виробу") === itemNum);
}
/* Індекс статусу послуги (Новий→В роботі→Готово, без «Видано» — воно на рівні виробу) */
const SERVICE_STATUSES = [
  ["🆕 Новий", "Новий"],
  ["⚙️ В роботі", "В роботі"],
  ["✅ Готово", "Готово"]
];
function serviceStatusIndex(status) {
  if (status === "✅ Готово") return 2;
  if (status === "⚙️ В роботі") return 1;
  return 0;
}
/* Чи є в замовленні виріб, де одна послуга вже почата/готова, а інша ще ні */
function orderHasStalledServices(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const active = its.filter(it => gv(it,"Статус") !== "📦 Виданий");
  if (!active.length) return false;
  // Рівень речей: одна вже в роботі/готова, інша ще навіть не почата
  const itemIdxs = active.map(it => itemStatusIndex(gv(it,"Статус")));
  if (Math.max(...itemIdxs) >= 1 && Math.min(...itemIdxs) === 0) return true;
  // Рівень послуг всередині однієї речі
  return active.some(it => {
    const svcs = servicesOfItem(gv(it,"Номер виробу"));
    if (svcs.length < 2) return false;
    const idxs = svcs.map(sv => serviceStatusIndex(gv(sv,"Статус")));
    return Math.max(...idxs) >= 1 && Math.min(...idxs) === 0;
  });
}

/* Повторна спроба при збої мережі/навантаженні Google — до 3 разів на запит,
   перш ніж здатися. Спільна для loadData() і loadPrice() — раніше прайс
   вантажився окремо і без жодного захисту, тому міг тихо лишитися порожнім. */
function fetchWithRetry(url, opts, tries) {
  tries = tries || 3;
  return fetch(url, opts).then(function(res) {
    if (!res.ok && tries > 1) return fetchWithRetry(url, opts, tries - 1);
    return res;
  }).catch(function(err) {
    if (tries > 1) return fetchWithRetry(url, opts, tries - 1);
    throw err;
  });
}

/* Розшифровує посилання bank.gov.ua/qr/BASE64 у реквізити ФОП.
   Формат НБУ (BCD/EPC): рядки через \n — [BCD, версія, кодування, тип, порожньо, Отримувач, IBAN, порожньо, Код, ...] */
function decodeFopQr() {
  PAY.fopName = ""; PAY.fopIban = ""; PAY.fopCode = "";
  if (!PAY.qrLink) return;
  try {
    let b64 = PAY.qrLink.split("/qr/")[1] || "";
    if (!b64) return;
    b64 = b64.replace(/-/g,"+").replace(/_/g,"/");
    while (b64.length % 4) b64 += "=";
    const bytes = atob(b64);
    const decoded = decodeURIComponent(escape(bytes));
    const lines = decoded.split("\n");
    PAY.fopName = (lines[5] || "").trim();
    PAY.fopIban = (lines[6] || "").trim();
    PAY.fopCode = (lines[8] || "").trim();
  } catch(e) { console.error("decodeFopQr failed", e); }
}
function fopConfigured() { return !!(PAY.qrLink && PAY.fopIban); }
function ibanPretty(iban) {
  return (iban || "").replace(/(.{4})/g, "$1 ").trim();
}


async function parseTailor(res) {

    if (start === -1) return [];
    const json = JSON.parse(text.substring(start, end + 1));
    if (!json.table || !json.table.rows) return [];
    const cols = ["Номер","Дата створення","Приймальник","Ім'я клієнта","Телефон","Месенджер",
                  "Виріб","Матеріал","Мірки","Умови","Вартість","Оплата","Спосіб передоплати",
                  "Сума доплати","Спосіб доплати","Термін","Статус","Примітка","Фото","Референс"];
    return json.table.rows.map(row => {
      const obj = {}; const cells = row.c || [];
      cols.forEach((col, i) => {
        const cell = cells[i];
        obj[col] = cell && cell.v != null ? gvizDate(cell.v) : "";
      });

}

/* ═══════════════ ВИДИ ВИРОБІВ (моделі → тариф/розмір) ═══════════════
   Лист «Види»: Категорія (shoes/bags) | Тип (модель) | Розмір | Типовий.
   Взуття: Розмір = тарифна група (низьке взуття…). Сумки: Розмір = S/M/L (типовий). */
async function parseVydy(res) {
  try {
    const text = await res.text();
    const start = text.indexOf("{"), end = text.lastIndexOf("}");
    if (start === -1) return [];
    const json = JSON.parse(text.substring(start, end + 1));
    if (!json.table || !json.table.rows) return [];
    const cols = ["Категорія","Тип","Розмір","Типовий"];
    return json.table.rows.map(row => {
      const obj = {}; const cells = row.c || [];
      cols.forEach((col, i) => { const c = cells[i]; obj[col] = c && c.v != null ? String(c.v).trim() : ""; });
      return obj;
    }).filter(v => v["Тип"] && v["Категорія"]);
  } catch(e) { return []; }
}
/* Лист «Майстри»: Майстер | Ставка/год */
async function parseMasters(res) {
  try {
    const text = await res.text();
    const start = text.indexOf("{"), end = text.lastIndexOf("}");
    if (start === -1) return [];
    const json = JSON.parse(text.substring(start, end + 1));
    if (!json.table || !json.table.rows) return [];
    const out = [];
    json.table.rows.forEach(row => {
      const c = row.c || [];
      const name = c[0] && c[0].v != null ? String(c[0].v).trim() : "";
      const rate = c[1] && c[1].v != null ? String(c[1].v).trim() : "";
      if (name && name.toLowerCase() !== "майстер") out.push({ name: name, rate: rate });
    });
    return out;
  } catch(e) { return []; }
}
function masterNames() { return MASTERS.map(m => m.name); }
function colorList() {
  const extra = COLORS.filter(c => { const l = c.toLowerCase(); return l !== "колір" && l !== "кольори"; });
  return Array.from(new Set(DEFAULT_COLORS.concat(extra)));
}

async function parseBrands(res) {  try {
    const text = await res.text();
    const start = text.indexOf("{"), end = text.lastIndexOf("}");
    if (start === -1) return [];
    const json = JSON.parse(text.substring(start, end + 1));
    if (!json.table || !json.table.rows) return [];
    const out = [];
    // заголовок може бути в cols[0].label
    if (json.table.cols && json.table.cols[0] && json.table.cols[0].label) {
      const h = String(json.table.cols[0].label).trim();
      if (h && h.toLowerCase() !== "бренд" && h.toLowerCase() !== "бренди") out.push(h);
    }
    json.table.rows.forEach(row => {
      const c = row.c && row.c[0];
      const v = c && c.v != null ? String(c.v).trim() : "";
      if (v && v.toLowerCase() !== "бренд") out.push(v);
    });
    return Array.from(new Set(out));
  } catch(e) { return []; }
}
/* Скільки разів кожен "Тип" реально зустрічається серед усіх виробів —
   рахуємо з живих даних (ITEMS), нічого не прописано вручну. Використовується,
   щоб у списку "Вид виробу" найпопулярніші типи були зверху, а ті, що
   майже не обираються — внизу. */
function typeFrequency(category) {
  const freq = {};
  ITEMS.forEach(it => {
    const t = gv(it, "Тип");
    if (t) freq[t] = (freq[t] || 0) + 1;
  });
  return freq;
}
function modelsFor(category) {
  const list = VYDY.filter(v => v["Категорія"] === category);
  const freq = typeFrequency(category);
  // Стабільне сортування: частіше використані — вище, невикористані (0) — в кінець,
  // за рівних умов лишається порядок листа "Види".
  return list
    .map((v, i) => ({ v, i, f: freq[v["Тип"]] || 0 }))
    .sort((a, b) => b.f - a.f || a.i - b.i)
    .map(x => x.v);
}function modelInfo(category, type) {
  return VYDY.find(v => v["Категорія"] === category && v["Тип"] === type) || null;
}

/* Три «модельні» операції — ціна тягнеться з прайсу за тарифом/розміром */
const CORE_OPS = ["Базовий догляд", "Чищення", "Фарбування", "Реставрація"];
/* Знайти рядок прайсу: назва містить операцію + усі токени (тариф / розмір+матеріал) */
/* Реальні тарифні групи взуття ("низьке взуття", "літнє взуття"...) —
   витягуються з назв рядків прайсу виду "{операція} — {група}" для CORE_OPS.
   Нічого не прописано вручну, тому лишається вірним, якщо групи зміняться. */
function shoeSizeGroups() {
  const cat = PRICE["shoes"]; if (!cat) return [];
  const set = new Set();
  Object.keys(cat.departments).forEach(dept => {
    cat.departments[dept].forEach(s => {
      const nm = s.name;
      for (let k = 0; k < CORE_OPS.length; k++) {
        const prefix = CORE_OPS[k] + " — ";
        if (nm.indexOf(prefix) === 0) { set.add(nm.slice(prefix.length).trim()); break; }
      }
    });
  });
  return Array.from(set);
}
function findCorePrice(category, op, tokens) {
  const cat = PRICE[category]; if (!cat) return null;
  let found = null;
  Object.keys(cat.departments).forEach(dept => {
    cat.departments[dept].forEach(s => {
      if (found || s.active === false) return;
      const nm = s.name.toLowerCase();
      if (nm.indexOf(op.toLowerCase()) === -1) return;
      if (tokens.every(t => nm.indexOf(t.toLowerCase()) !== -1)) found = s;
    });
  });
  return found;
}
/* Ціна операції для конкретного товару (з урахуванням розміру/матеріалу) */
function opPriceFor(item, op) {
  if (!item.model) return null;
  if (item.category === "bags") {
    if (item.model === "Поясний ремінь") {
      return findCorePrice("bags", op, ["поясний ремінь"]);
    }
    const size = item.size || "M";
    const mat = (op === "Чищення") ? (item.material || "шкіряна") : "шкіряна";
    return findCorePrice("bags", op, ["сумка " + size, mat]);
  }
  if (!item.size) return null; // для взуття size = тарифна група
  return findCorePrice("shoes", op, [item.size]);
}
/* Підпис операції у чек: лише операція (+ розмір для сумок). Модель — у заголовку виробу. */
function coreLineName(item, op) {
  const size = (item.category === "bags" && item.size) ? " (" + item.size + ")" : "";
  return op + size;
}
/* Перерахувати всі модельні рядки товару після зміни моделі/розміру/матеріалу */
function recomputeCore(it) {
  it.services.forEach(s => {
    if (s.kind !== "core") return;
    const p = opPriceFor(it, s.op);
    if (p) s.price = parseInt(p.price) || 0;
    s.name = coreLineName(it, s.op);
  });
}

function extractAmt(str) {
